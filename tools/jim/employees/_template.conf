# Employee template — copy to employees/<name>.conf to hire a new gofer.
# Then: cp personas/jim.md personas/<name>.md (edit it) and `ln -s gofer.sh bin/<name>`.

EMPLOYEE_NAME="Bob"
EMPLOYEE_ROLE="Local grunt-work gofer (supervised)"

# The brain you want to audition for this hire.
MODEL="qwen3-coder:30b"

# Optional cloud escalation brain (used only with --escalate).
ESCALATION_MODEL="kimi-k3:cloud"

# Endpoint — omit to inherit config.sh defaults (ricksm5.local:11434).
HOST="ricksm5.local"
PORT="11434"

# Persona file under personas/ (defaults to <employee>.md if unset).
PERSONA=""

TEMPERATURE="0.2"
MAX_TOKENS="2048"
