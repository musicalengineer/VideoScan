# Employee: Jim — the local grunt-work gofer.
#
# To AUDITION A DIFFERENT BRAIN for the same role, change MODEL and re-run the eval.
# To HIRE A NEW PERSON instead, copy this file to employees/<name>.conf, copy
# personas/jim.md to personas/<name>.md, and `ln -s gofer.sh bin/<name>`.

EMPLOYEE_NAME="Jim"
EMPLOYEE_ROLE="Local grunt-work gofer (supervised)"

# Primary brain — runs locally on the M5, so it is free and private. Candidates
# that fit 48GB unified memory at 4-bit: qwen3:30b-a3b (MoE, fast), qwen3-coder:30b,
# qwen3:32b (dense, slower/sharper).
# 2026-07-31: flipped from qwen3:30b-a3b to qwen3.6 after it won the 12-task bake-off
# (10/10 vs 9/10; better judgment on when NOT to escalate — e.g. answers "2+2" instead
# of punting). Command stays "jim"; only the brain changed. Prior: MODEL="qwen3:30b-a3b".
MODEL="qwen3.6:35b-a3b-nvfp4"

# Optional cloud brain used only with --escalate (Ollama Cloud; leaves the machine,
# is rate-limited on the free tier, is NOT private). For the hard 5% Jim can't do.
ESCALATION_MODEL="kimi-k3:cloud"

# Endpoint (override the shared defaults only if this employee lives elsewhere).
HOST="ricksm5.local"
PORT="11434"

# Persona / job description file under personas/ (defaults to <employee>.md).
PERSONA="jim.md"

# Low temperature: this is deterministic grunt work, not creative writing.
TEMPERATURE="0.2"
MAX_TOKENS="2048"

# Gofer tasks are bounded grunt work — answer directly, no reasoning budget burn.
THINK="false"
