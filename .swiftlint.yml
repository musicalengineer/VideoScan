# SwiftLint configuration for VideoScan.
#
# Philosophy: catch real code-health problems (god objects, deeply branching
# functions, huge files) without style-nagging. Most default rules are opted
# out so the signal-to-noise ratio stays high for a single-dev project.
#
# To run locally:         swiftlint
# To auto-fix where safe: swiftlint --fix
#
# Escalation path:
#   1. Today: warnings only, CI non-blocking. Baseline has ~80 real warnings.
#   2. After refactors reduce big files/functions: switch CI to --strict.

included:
  - VideoScan/VideoScan
  - swift_cli

excluded:
  - VideoScan/build
  - build
  - .build
  - DerivedData
  - venv
  - tests/fixtures

# Disable all the style-police rules — they create noise without catching bugs.
# Every rule here was triggering on real code that is fine as-is.
disabled_rules:
  - trailing_whitespace
  - opening_brace
  - line_length
  - todo
  - identifier_name
  - type_name
  - nesting
  - force_cast
  - force_try
  - shorthand_operator
  - statement_position
  - vertical_whitespace
  - comma
  - colon
  - control_statement
  - return_arrow_whitespace
  - redundant_string_enum_value
  - redundant_void_return
  - unused_closure_parameter
  - unused_optional_binding
  - for_where
  - empty_enum_arguments
  - function_parameter_count
  - large_tuple
  - trailing_comma
  - legacy_constructor
  - legacy_hashing
  - implicit_optional_initialization
  - multiple_closures_with_trailing_closure
  - vertical_parameter_alignment
  - switch_case_alignment
  - trailing_newline
  - unused_enumerated
  - redundant_discardable_let
  - blanket_disable_command
  - orphaned_doc_comment

# --- Size / complexity rules: the reason we're running this tool at all. ---

file_length:
  warning: 1000
  error: 3000          # VideoScanModel (2711), PersonFinderModel (2758) ride under

type_body_length:
  warning: 600
  error: 3000

function_body_length:
  warning: 80
  error: 300           # PersonFinderModel has one 274-line function today; set error above that
                       # so existing code warns but new >300-line functions fail.

cyclomatic_complexity:
  warning: 15
  error: 30

# --- Opt-in rules worth having on ---
opt_in_rules:
  - empty_count            # .count == 0 → isEmpty
  - empty_string           # "" comparisons
  - first_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - last_where
  - toggle_bool
  - redundant_nil_coalescing
  - sorted_first_last
  - fatal_error_message
  - force_unwrapping       # must be in opt_in_rules for the severity config below to apply

# force_unwrapping warn-only (not error). Tests get a lot of legitimate `!`.
force_unwrapping:
  severity: warning

# inclusive_language: allow "master". Every occurrence in this codebase is
# legitimate domain vocabulary, not casual usage:
#   A. Persisted schema — VideoRecord.masterLocation is a Codable key written
#      into catalog.json; ArchiveStage.masterAssigned ("Master") is a stored
#      rawValue. Renaming is a schema migration, not a lint fix.
#   B. Catalog-sync architecture — the one Mac that owns the media and is the
#      sole writer is the "master" (vs N read-only "viewer" Macs). Documented
#      as load-bearing in CatalogSync.swift; backed by a persisted UserDefaults
#      key "CatalogSyncMasterHostname".
#   C. External spec term — "MasterMob" is the literal AAF/OMF/Avid file-format
#      term in AvbParser; it is not ours to rename.
# Redefine the flagged-term list to drop "master" while keeping the other
# defaults. (`override_terms` replaces the default set: master, slave,
# blacklist, whitelist.)
inclusive_language:
  override_terms:
    - slave
    - blacklist
    - whitelist

# --- Custom rules: project-specific antipattern detectors. ---
#
# Each rule below is a regex-based check for a known shape of bug that has
# bitten this project at least once. The cost of writing a rule (~half a
# day) is paid back permanently — the rule catches the pattern at lint
# time on every PR, no Swift-expert review needed. See
# project_bug_prevention_strategy memory for the framework.
#
# To test a single rule against the codebase:
#   swiftlint lint --no-cache --enable-rule <rule-name>
#
custom_rules:

  # ----- chained_sheet_isPresented ------------------------------------------
  #
  # Bug: TriageView and CatalogHelpers each had two consecutive
  # `.sheet(isPresented: $a)` and `.sheet(isPresented: $b)` modifiers with a
  # `DispatchQueue.main.asyncAfter(0.4)` defer between them. The defer was
  # the original author's documented band-aid for SwiftUI's "one sheet per
  # view" rule. Under any system load, the dismiss of the first sheet
  # outran the 0.4s window and the second sheet tried to present while the
  # first was still dismissing → SwiftUI modal state machine deadlocked
  # → app appeared unresponsive ("half-iconified frozen sheet").
  #
  # Fix: replace with a single .sheet(item:) driven by an Identifiable enum
  # whose cases ALL return the same `id`. See project_chained_sheet_antipattern
  # memory for the recipe.
  #
  # The regex matches when two `.sheet(isPresented:` calls appear within
  # ~600 characters of each other (roughly 15–25 lines, which covers any
  # realistic same-view modifier chain). False-positive cases (two sheets
  # on genuinely different views that happen to live close in the same
  # file) are rare in this codebase; if you hit one, use a
  # // swiftlint:disable:next chained_sheet_isPresented annotation.
  chained_sheet_isPresented:
    name: "Chained .sheet(isPresented:) modifiers"
    regex: '\.sheet\s*\(\s*isPresented:[\s\S]{0,600}?\.sheet\s*\(\s*isPresented:'
    message: "Two .sheet(isPresented:) modifiers in close succession race the dismiss animation against the second present. Replace with .sheet(item:) driven by an Identifiable enum with a SINGLE shared id across all cases. See project_chained_sheet_antipattern memory."
    severity: warning

  # ----- async_after_presentation_flip --------------------------------------
  #
  # Bug shape: a `DispatchQueue.main.asyncAfter(deadline: .now() + X)` whose
  # closure flips a `show*` / `is*Presented` style binding. Almost always a
  # timing band-aid for a SwiftUI animation race. The 0.4s defer between
  # confirm sheet and result sheet is the canonical example. Replace with
  # a proper state-machine transition (.sheet(item:), .onChange of the
  # presentation binding, etc.). See project_bug_prevention_strategy memory.
  #
  # Regex matches `DispatchQueue.main.asyncAfter` followed within ~300
  # characters by a write to a `show*` identifier. Narrow enough to avoid
  # false-positives on legitimate timing patterns.
  async_after_presentation_flip:
    name: "DispatchQueue.asyncAfter flipping a presentation binding"
    regex: 'DispatchQueue\.main\.asyncAfter[\s\S]{0,300}?\s+show[A-Z][a-zA-Z]*\s*='
    message: "asyncAfter that sets a `show*` binding is a timing band-aid for a SwiftUI animation race. Replace with a proper state-machine transition (.sheet(item:) atomic content swap, .onChange of dismiss completion, etc.). See project_bug_prevention_strategy memory."
    severity: warning
