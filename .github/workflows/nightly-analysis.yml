name: Nightly Static Analysis

# Runs every night at 01:00 EDT (05:00 UTC) and is also manually
# triggerable from the Actions tab. GH-hosted runners are useful here
# for static/build-derived signal, not for unit-test execution.
#
# Jobs (run in parallel):
#   strict-concurrency  — Swift compiler with -strict-concurrency=complete,
#                         all upcoming features enabled as warnings,
#                         compile-time perf warnings.
#   codeql              — GitHub CodeQL with security-and-quality
#                         (the broadest standard suite).
#   thread-sanitizer    — Disabled on GH-hosted runners. Run TSan on local
#                         Mac hardware / self-hosted macOS instead.
#   lint-strict         — SwiftLint --strict + Periphery without retain-public.
#   source-ratchets     — Build-free source ratchets (pure Python, ubuntu):
#                         subprocess-injection + check-then-act on removable
#                         volumes, both against grandfathered baselines in
#                         ci/baselines/. Fails only on NEW violations.
#   aggregate           — Collects every count and appends one row to
#                         metrics/static_analysis.jsonl on the metrics branch.
#
# Findings appear in:
#   1. Each run's Summary panel (markdown — green or expandable details)
#   2. Security → Code Scanning (CodeQL alerts, deduped over time)
#   3. metrics/static_analysis.jsonl (history for the dashboard)

on:
  schedule:
    # 05:00 UTC daily — that's 01:00 EDT in summer, 00:00 EST in winter.
    # GitHub schedules can drift by minutes under load.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write          # needed for the metrics push step
  security-events: write   # needed for CodeQL SARIF upload

jobs:

  # -------------------------------------------------------------------
  strict-concurrency:
    name: Swift strict concurrency (max)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      # warning_count = concurrency-class findings only.
      #
      # The -warn-long-* perf-timing lines used to be worse than noisy — they
      # were INVISIBLE. The bucket grep matched the FLAG names
      # ("warn-long-function-bodies"), but the compiler's warning text never
      # contains them; it says "took 254ms to type-check (limit: 100ms)". So
      # perf-findings.txt was empty every single night while 98 real timing
      # warnings hid in the "other" bucket (found 2026-09-13). Fixed below.
      #
      # They are now parsed properly by scripts/typecheck_timing_ratchet.py,
      # which keys each finding by FUNCTION IDENTITY (file + symbol) and
      # carries the millisecond value as data. That is what makes the trend
      # readable: the same slow function is the same entry night over night,
      # instead of sort -u re-counting it whenever the timing jittered.
      warning_count: ${{ steps.count.outputs.concurrency }}
      warning_total: ${{ steps.count.outputs.warnings }}
      typecheck_identities: ${{ steps.typecheck.outputs.typecheck_identities }}
      typecheck_new_slow: ${{ steps.typecheck.outputs.typecheck_new_over_threshold }}
      typecheck_saturated: ${{ steps.typecheck.outputs.typecheck_saturated }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Build with strict concurrency + all upcoming features + perf warnings
        run: |
          set -o pipefail
          # Every Swift "upcoming feature" we can flip on as a warning.
          # `enable-upcoming-feature` opts a code path into Swift 6 semantics
          # while staying on Swift 5 — perfect for nightly reporting.
          #
          # NOTE: `InternalImportsByDefault` is intentionally OMITTED from
          # this list. Enabling it triggers a hard build error in
          # swift-numerics (transitive dep via Charts):
          #   Double+Real.swift:N: error: 'libm_cos' is internal and cannot
          #   be referenced from a '@_transparent' function
          # That's an upstream issue in swift-numerics's @_transparent
          # libm shims when InternalImports is enabled; not our code.
          # Revisit once swift-numerics is bumped past the fixed release
          # (https://github.com/apple/swift-numerics — track @_transparent
          # cleanup). See bug-fix dispatch 2026-06-02.
          UPCOMING_FLAGS=""
          for feat in BareSlashRegexLiterals ConciseMagicFile \
                      ForwardTrailingClosures ImplicitOpenExistentials \
                      StrictConcurrency ImportObjcForwardDeclarations \
                      DisableOutwardActorInference IsolatedDefaultValues \
                      GlobalConcurrency InferSendableFromCaptures \
                      RegionBasedIsolation ExistentialAny \
                      DeprecateApplicationMain; do
            UPCOMING_FLAGS+=" -Xfrontend -enable-upcoming-feature -Xfrontend $feat"
          done
          # Compiler-side perf cliffs (type-inference >100ms).
          PERF_FLAGS=" -Xfrontend -warn-long-function-bodies=100 -Xfrontend -warn-long-expression-type-checking=100"
          # Concurrency reporting flags.
          CONCUR_FLAGS=" -Xfrontend -warn-concurrency -Xfrontend -enable-actor-data-race-checks"

          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_STRICT_CONCURRENCY=complete \
            OTHER_SWIFT_FLAGS="\$(inherited)$CONCUR_FLAGS$UPCOMING_FLAGS$PERF_FLAGS" \
            2>&1 | tee strict-concurrency.log
          if grep -q "BUILD FAILED" strict-concurrency.log; then
            echo "::error::Build itself failed (not a warning issue) — see log"
            exit 1
          fi

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          if [ -f strict-concurrency.log ]; then
            grep -E ': warning: ' strict-concurrency.log | sort -u > all-warnings.txt || true
            grep -E '(sendable|data race|actor-isolated|concurrency|main actor|nonisolated|@Sendable)' all-warnings.txt > concurrency-findings.txt || true
            # Match the WARNING TEXT, not the flag name. The old pattern
            # ('warn-long-function-bodies') never appears in compiler output,
            # so this bucket read 0 every night since the job was written.
            grep -E 'took [0-9]+ms to type-check' all-warnings.txt > perf-findings.txt || true
            grep -Ev '(sendable|data race|actor-isolated|concurrency|main actor|nonisolated|@Sendable|took [0-9]+ms to type-check)' all-warnings.txt > other-findings.txt || true
            # The saturated case is an ERROR, not a warning, so it is not in
            # all-warnings.txt. It is the shape that turned CI red on
            # 2026-09-01 (CatalogView.body, 495 lines, compiles on the M4 and
            # not on the runner), so pull it out of the raw log separately.
            grep -E 'unable to type-check this expression in reasonable time' strict-concurrency.log | sort -u > typecheck-saturated.txt || true
          else
            : > all-warnings.txt; : > concurrency-findings.txt; : > perf-findings.txt; : > other-findings.txt; : > typecheck-saturated.txt
          fi

          C_COUNT=$(wc -l < concurrency-findings.txt | tr -d ' ')
          P_COUNT=$(wc -l < perf-findings.txt | tr -d ' ')
          O_COUNT=$(wc -l < other-findings.txt | tr -d ' ')
          TOTAL=$(wc -l < all-warnings.txt | tr -d ' ')
          echo "warnings=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "concurrency=$C_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Swift strict concurrency (max)"
            echo ""
            echo "| Category | Count |"
            echo "|---|---:|"
            echo "| Concurrency / Sendable / data race | $C_COUNT |"
            echo "| Compile-time perf (>100ms type check) | $P_COUNT |"
            echo "| Upcoming-feature / other | $O_COUNT |"
            echo "| **Total** | **$TOTAL** |"
            echo ""
            for label_file in "Concurrency:concurrency-findings.txt" "Perf:perf-findings.txt" "Other:other-findings.txt"; do
              label="${label_file%%:*}"
              file="${label_file##*:}"
              n=$(wc -l < "$file" | tr -d ' ')
              if [ "$n" != "0" ]; then
                echo "<details><summary>$label findings ($n)</summary>"
                echo ""
                echo '```'
                head -200 "$file"
                if [ "$n" -gt 200 ]; then echo "... (truncated, see artifact for full list)"; fi
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------
      # The type-check timing metric, made readable.
      #
      # Parses every "took NNNms to type-check" warning (and the saturated
      # "unable to type-check ... in reasonable time" error) and keys each one
      # by FUNCTION IDENTITY — file + symbol — with the millisecond value as
      # data rather than part of the key. That produces a top-20 list that is
      # the same list tomorrow, and turns "a new function crossed the line"
      # into a real event.
      #
      # THIS STEP CAN FAIL THE JOB, and it is not a build failure when it
      # does: it means a NEW function type-checks slower than the threshold in
      # scripts/typecheck_timing_ratchet.py (NEW_FUNCTION_THRESHOLD_MS, 500).
      # Known-slow entries are grandfathered in ci/baselines/typecheck_timing.json
      # and entries that merely got slower are reported, never gated — gating
      # on a jittering millisecond value would rebuild the exact noise this
      # replaces.
      - name: Type-check timing (identity-keyed) + ratchet
        id: typecheck
        if: always()
        run: |
          python3 scripts/typecheck_timing_ratchet.py strict-concurrency.log \
            --json-out typecheck-timing.json \
            --top-out typecheck-top20.txt

      - name: Upload concurrency artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-concurrency-log
          path: |
            strict-concurrency.log
            all-warnings.txt
            concurrency-findings.txt
            perf-findings.txt
            other-findings.txt
            typecheck-saturated.txt
            typecheck-timing.json
            typecheck-top20.txt
          retention-days: 30

  # -------------------------------------------------------------------
  codeql:
    name: CodeQL (Swift, security-and-quality)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      finding_count: ${{ steps.count.outputs.findings }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          # `manual` mode tells CodeQL to extract from our explicit build
          # below rather than racing its own autobuild. Previously the
          # SARIF showed 177 "cannot find type 'PhotosPickerItem' in scope"
          # indexer errors and 0 results — autobuild was producing a
          # partial AST that the analyse step then queried.
          build-mode: manual
          queries: security-and-quality

      - name: Build for CodeQL
        run: |
          # pipefail: a failed build used to hide behind `| tail` and let
          # CodeQL "succeed" on 1 of 1,283 files (GH #171).
          #
          # Explicitly built modules OFF (2026-09-09, GH #171 attempt 8):
          # with the build green, CodeQL still scanned 82 of 1,311 files.
          # The SARIF carried 1,875 extractor errors of one shape — "module
          # file …/ModuleCache.noindex/_DarwinFoundation1-….pcm built from a
          # different branch (clang-1700.6.4.2) than the compiler
          # (swiftlang/llvm-project …)" and "failed to emit precompiled
          # module '/dev/null'". Xcode 26 precompiles the SDK's clang
          # modules itself and hands them to swift-frontend as explicit
          # inputs; CodeQL's extractor is a different frontend build and
          # refuses those PCMs, so every file that imports Foundation is
          # dropped. With implicit modules the extractor builds its own.
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            _EXPERIMENTAL_SWIFT_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            2>&1 | tail -300

      - name: Analyse with CodeQL
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:swift'
          upload: always
          output: codeql-results

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          COUNT=0
          if [ -d codeql-results ]; then
            for sarif in codeql-results/*.sarif; do
              [ -f "$sarif" ] || continue
              N=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" "$sarif")
              COUNT=$((COUNT + N))
            done
          fi
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## CodeQL (Swift, security-and-quality)"
            echo ""
            if [ "$COUNT" = "0" ]; then
              echo "✅ **No CodeQL findings.**"
            else
              echo "⚠️ **$COUNT CodeQL findings.** Triage in **Security → Code Scanning**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 30

  # -------------------------------------------------------------------
  thread-sanitizer:
    name: Thread Sanitizer (Mac/self-hosted only)
    if: false
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      issue_count: ${{ steps.count.outputs.tsan_issues }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Run unit tests under TSan
        run: |
          echo "TSan is disabled on GH-hosted macOS runners. Run on local/self-hosted Mac hardware."
          # This is a *reporting* job — we want to capture TSan output
          # even when tests fail. Tests can fail under instrumentation
          # because TSan exposes real races, slows execution enough to
          # blow timeouts, or both. We don't want any of those to mask
          # the report. Final `|| true` swallows xcodebuild's non-zero
          # exit; the count step below is authoritative.
          xcodebuild test \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:VideoScanTests \
            -enableThreadSanitizer YES \
            -resultBundlePath TSanResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee tsan.log || true

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          if [ -f tsan.log ]; then
            grep -E "ThreadSanitizer: " tsan.log | sort -u > tsan-findings.txt || true
            # Also pull the list of tests that failed under instrumentation.
            grep -E "^Test case '.*' failed on" tsan.log | sort -u > tsan-failed-tests.txt || true
          else
            : > tsan-findings.txt; : > tsan-failed-tests.txt
          fi
          COUNT=$(wc -l < tsan-findings.txt | tr -d ' ')
          FAILED_TESTS=$(wc -l < tsan-failed-tests.txt | tr -d ' ')
          echo "tsan_issues=$COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Thread Sanitizer"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| TSan race reports | $COUNT |"
            echo "| Tests failing under instrumentation | $FAILED_TESTS |"
            echo ""
            if [ "$COUNT" != "0" ]; then
              echo "<details><summary>TSan race reports ($COUNT)</summary>"
              echo ""
              echo '```'
              head -200 tsan-findings.txt
              if [ "$COUNT" -gt 200 ]; then echo "... (truncated)"; fi
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            if [ "$FAILED_TESTS" != "0" ]; then
              echo "<details><summary>Failed tests under TSan ($FAILED_TESTS)</summary>"
              echo ""
              echo '```'
              head -100 tsan-failed-tests.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TSan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: |
            tsan.log
            tsan-findings.txt
            TSanResults.xcresult
          retention-days: 30

  # -------------------------------------------------------------------
  lint-strict:
    name: SwiftLint --strict + Periphery aggressive
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      swiftlint_count: ${{ steps.count.outputs.swiftlint }}
      periphery_count: ${{ steps.count.outputs.periphery }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Install tools
        run: |
          brew install swiftlint || true
          # Use the homebrew-core formula (3.x), not the cask (stuck at 2.21.2).
          brew install periphery || true
          echo "Periphery: $(periphery version)"
          echo "SwiftLint: $(swiftlint version)"

      - name: SwiftLint --strict
        run: |
          # --strict promotes warnings to errors, but we just want to count
          # them. Don't fail the step on non-zero exit.
          swiftlint lint --strict --reporter xcode > swiftlint-strict.txt 2>&1 || true

      - name: Build (Periphery needs the build for index data)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath periphery-dd 2>&1 | tail -300

      - name: Periphery aggressive (no --retain-public)
        run: |
          # `--retain-public` is OFF — for a single-app codebase, public API
          # that nothing inside calls is genuinely unused.
          periphery scan \
            --project VideoScan/VideoScan.xcodeproj \
            --schemes VideoScan \
            --targets VideoScan \
            --format xcode \
            > periphery-strict.txt 2>&1 || true

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          # `grep -c` already prints "0" on no-match (and exits 1).
          # Pairing that with `|| echo 0` was producing "0\n0" — a
          # multi-line value GH Actions then rejected as malformed
          # output ("Invalid format '0'"). Using `|| true` swallows
          # the exit code without re-printing.
          SL=$(grep -c ": warning:\|: error:" swiftlint-strict.txt 2>/dev/null || true)
          PF=$(grep -c "^/" periphery-strict.txt 2>/dev/null || true)
          SL=${SL:-0}
          PF=${PF:-0}
          echo "swiftlint=$SL" >> "$GITHUB_OUTPUT"
          echo "periphery=$PF" >> "$GITHUB_OUTPUT"

          {
            echo "## SwiftLint --strict + Periphery aggressive"
            echo ""
            echo "| Tool | Findings |"
            echo "|---|---:|"
            echo "| SwiftLint --strict | $SL |"
            echo "| Periphery (no --retain-public) | $PF |"
            echo ""
            if [ "$SL" != "0" ]; then
              echo "<details><summary>SwiftLint findings ($SL)</summary>"
              echo ""
              echo '```'
              head -100 swiftlint-strict.txt
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            if [ "$PF" != "0" ]; then
              echo "<details><summary>Periphery findings ($PF)</summary>"
              echo ""
              echo '```'
              head -100 periphery-strict.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-strict
          path: |
            swiftlint-strict.txt
            periphery-strict.txt
          retention-days: 30

  # -------------------------------------------------------------------
  # Warn-only SwiftLint + Periphery — historically lived in ci.yml on
  # every push. Moved here 2026-06-02 to keep per-push CI focused on
  # build+tests. Never fails the workflow; report is informational only.
  lint-warn:
    name: SwiftLint + Periphery (warn-only)
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Install tools
        run: |
          brew install swiftlint || true
          brew install periphery || true
          echo "Periphery: $(periphery version)"
          echo "SwiftLint: $(swiftlint version)"

      - name: SwiftLint (warn-only)
        run: |
          echo "## SwiftLint Report (warn-only)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter emoji 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter xcode > swiftlint-raw.txt 2>&1 || true

      - name: Build (Periphery needs index data)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath DerivedData 2>&1 | tail -300

      - name: Periphery (warn-only, default retention)
        continue-on-error: true
        run: |
          echo "## Periphery — unused code (warn-only)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          periphery scan \
            --skip-build \
            --index-store-path DerivedData/Index.noindex/DataStore \
            --format xcode \
            2>&1 | tee periphery-raw.txt | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload warn-only logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-warn
          path: |
            swiftlint-raw.txt
            periphery-raw.txt
          retention-days: 14

  # -------------------------------------------------------------------
  # Build-free source ratchets. Pure python3 stdlib over the .swift text, so
  # this needs no Xcode, no Metal toolchain and no 40-minute build — it runs
  # on ubuntu in well under a minute and reports even on the nights the macOS
  # build dies (which, per GH #171, is a thing that happens).
  #
  # Both checkers are GRANDFATHERED ratchets: today's hits are recorded in
  # ci/baselines/*.json and reported as pre-existing; the job goes red only on
  # a NEW violation or on a baseline entry that grew. We are not refactoring
  # 1,300 files tonight — we are stopping the bleeding.
  #
  # Run either one locally exactly as CI does:
  #   python3 scripts/check_subprocess_injection.py --root .
  #   python3 scripts/check_volume_check_then_act.py --root .
  # Accept a deliberate change with --update-baseline, and explain it in the
  # commit message.
  source-ratchets:
    name: Source ratchets (injection + check-then-act)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      injection_new: ${{ steps.injection.outputs.new_count }}
      injection_baseline: ${{ steps.injection.outputs.pre_existing_count }}
      checkthenact_new: ${{ steps.checkthenact.outputs.new_count }}
      checkthenact_baseline: ${{ steps.checkthenact.outputs.pre_existing_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pins the property that VideoScan never builds a shell command STRING:
      # ProcessRunner sets executableURL + an arguments ARRAY (posix_spawn with
      # a real argv), so there is no string for an injection to live in. Also
      # pins the ffmpeg concat-demuxer escaping, the one place our data reaches
      # a parser we do not control.
      - name: Subprocess-injection ratchet
        id: injection
        run: |
          python3 scripts/check_subprocess_injection.py \
            --root . \
            --json-out ratchet-injection.json

      # Reliability, not security: a removable volume can vanish between
      # "does this exist?" and the write. Fix template is the descriptor copy
      # in PromoteToArchiveJob / ArchivePromoteEngine.
      - name: Check-then-act on removable volumes
        id: checkthenact
        if: always()
        run: |
          python3 scripts/check_volume_check_then_act.py \
            --root . \
            --json-out ratchet-check-then-act.json

      - name: Upload ratchet findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ratchets
          path: |
            ratchet-injection.json
            ratchet-check-then-act.json
            ci/baselines/subprocess_injection.json
            ci/baselines/volume_check_then_act.json
          retention-days: 30

  # -------------------------------------------------------------------
  aggregate:
    name: Aggregate & push to metrics branch
    needs: [strict-concurrency, codeql, thread-sanitizer, lint-strict, source-ratchets]
    if: always()
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout (full history — need metrics branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build aggregate row + push
        env:
          CONCURRENCY_WARNINGS: ${{ needs.strict-concurrency.outputs.warning_count }}
          STRICT_WARNING_TOTAL: ${{ needs.strict-concurrency.outputs.warning_total }}
          CODEQL_FINDINGS: ${{ needs.codeql.outputs.finding_count }}
          TSAN_ISSUES: ${{ needs.thread-sanitizer.outputs.issue_count }}
          SWIFTLINT_STRICT: ${{ needs.lint-strict.outputs.swiftlint_count }}
          PERIPHERY_AGGRESSIVE: ${{ needs.lint-strict.outputs.periphery_count }}
          TYPECHECK_IDENTITIES: ${{ needs.strict-concurrency.outputs.typecheck_identities }}
          TYPECHECK_NEW_SLOW: ${{ needs.strict-concurrency.outputs.typecheck_new_slow }}
          TYPECHECK_SATURATED: ${{ needs.strict-concurrency.outputs.typecheck_saturated }}
          RATCHET_INJECTION_NEW: ${{ needs.source-ratchets.outputs.injection_new }}
          RATCHET_CHECKTHENACT_NEW: ${{ needs.source-ratchets.outputs.checkthenact_new }}
        run: |
          set -e
          TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SHA="${GITHUB_SHA:0:8}"
          # typecheck_identities is the column to watch over time: it is a
          # COUNT OF FUNCTIONS, not a count of log lines, so it no longer
          # wanders with millisecond jitter.
          ROW=$(printf '{"ts":"%s","sha":"%s","run_kind":"nightly","concurrency_warnings":%s,"strict_warning_total":%s,"codeql_findings":%s,"tsan_issues":%s,"swiftlint_strict":%s,"periphery_aggressive":%s,"typecheck_identities":%s,"typecheck_new_slow":%s,"typecheck_saturated":%s,"ratchet_injection_new":%s,"ratchet_check_then_act_new":%s}' \
                "$TS" "$SHA" \
                "${CONCURRENCY_WARNINGS:-null}" \
                "${STRICT_WARNING_TOTAL:-null}" \
                "${CODEQL_FINDINGS:-null}" \
                "${TSAN_ISSUES:-null}" \
                "${SWIFTLINT_STRICT:-null}" \
                "${PERIPHERY_AGGRESSIVE:-null}" \
                "${TYPECHECK_IDENTITIES:-null}" \
                "${TYPECHECK_NEW_SLOW:-null}" \
                "${TYPECHECK_SATURATED:-null}" \
                "${RATCHET_INJECTION_NEW:-null}" \
                "${RATCHET_CHECKTHENACT_NEW:-null}")
          echo "Row: $ROW"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git fetch origin metrics
            git switch metrics
          else
            git switch --orphan metrics
            : > .gitkeep
            git add .gitkeep
            git commit -m 'init metrics branch'
          fi

          mkdir -p metrics
          touch metrics/static_analysis.jsonl
          echo "$ROW" >> metrics/static_analysis.jsonl
          git add metrics/static_analysis.jsonl
          git commit -m "static analysis nightly $TS" || {
            echo "Nothing to commit"
            exit 0
          }
          git push origin metrics

      - name: Top-line summary
        if: always()
        env:
          CONCURRENCY_WARNINGS: ${{ needs.strict-concurrency.outputs.warning_count }}
          CODEQL_FINDINGS: ${{ needs.codeql.outputs.finding_count }}
          TSAN_ISSUES: ${{ needs.thread-sanitizer.outputs.issue_count }}
          SWIFTLINT_STRICT: ${{ needs.lint-strict.outputs.swiftlint_count }}
          PERIPHERY_AGGRESSIVE: ${{ needs.lint-strict.outputs.periphery_count }}
          TYPECHECK_IDENTITIES: ${{ needs.strict-concurrency.outputs.typecheck_identities }}
          TYPECHECK_NEW_SLOW: ${{ needs.strict-concurrency.outputs.typecheck_new_slow }}
          TYPECHECK_SATURATED: ${{ needs.strict-concurrency.outputs.typecheck_saturated }}
          RATCHET_INJECTION_NEW: ${{ needs.source-ratchets.outputs.injection_new }}
          RATCHET_INJECTION_BASE: ${{ needs.source-ratchets.outputs.injection_baseline }}
          RATCHET_CTA_NEW: ${{ needs.source-ratchets.outputs.checkthenact_new }}
          RATCHET_CTA_BASE: ${{ needs.source-ratchets.outputs.checkthenact_baseline }}
        run: |
          {
            echo "## Nightly static analysis — $(date -u +'%Y-%m-%d')"
            echo ""
            echo "| Tool | Findings |"
            echo "|---|---:|"
            echo "| Swift strict concurrency (max) | ${CONCURRENCY_WARNINGS:-?} |"
            echo "| CodeQL (security-and-quality) | ${CODEQL_FINDINGS:-?} |"
            echo "| Thread Sanitizer | Mac/self-hosted only |"
            echo "| SwiftLint --strict | ${SWIFTLINT_STRICT:-?} |"
            echo "| Periphery aggressive | ${PERIPHERY_AGGRESSIVE:-?} |"
            echo ""
            echo "| Ratchet | New (gated) | Grandfathered |"
            echo "|---|---:|---:|"
            echo "| Subprocess injection / concat escaping | ${RATCHET_INJECTION_NEW:-?} | ${RATCHET_INJECTION_BASE:-?} |"
            echo "| Check-then-act on removable volumes | ${RATCHET_CTA_NEW:-?} | ${RATCHET_CTA_BASE:-?} |"
            echo "| New function over the type-check threshold | ${TYPECHECK_NEW_SLOW:-?} | — |"
            echo ""
            echo "Slow-to-type-check identities tracked: **${TYPECHECK_IDENTITIES:-?}** "
            echo "(saturated / \"unable to type-check\": **${TYPECHECK_SATURATED:-?}**). "
            echo "Top 20 worst is in the strict-concurrency job summary and in the "
            echo "\`strict-concurrency-log\` artifact as \`typecheck-top20.txt\`."
            echo ""
            echo "Per-tool details are in the jobs above. CodeQL alerts also live under **Security → Code Scanning**."
            echo "Trend history: \`metrics/static_analysis.jsonl\` on the \`metrics\` branch."
          } >> "$GITHUB_STEP_SUMMARY"
