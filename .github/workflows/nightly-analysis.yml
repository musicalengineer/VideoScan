name: Nightly Static Analysis

# Runs every night at 01:00 EDT (05:00 UTC) and is also manually
# triggerable from the Actions tab. GitHub-hosted runners only; nothing in
# this workflow touches the M4.
#
# Jobs (run in parallel unless noted):
#   strict-concurrency  — Swift compiler with -strict-concurrency=complete,
#                         all upcoming features enabled as warnings,
#                         compile-time perf warnings, and Swift 6.2 strict
#                         memory safety (SE-0458) as counted warnings when
#                         the toolchain accepts the flag (probed, not assumed).
#   codeql              — GitHub CodeQL with security-and-quality
#                         (the broadest standard suite), plus an extraction
#                         FLOOR: the job fails if CodeQL extracted fewer than
#                         80% of the app + VideoScanCore Swift sources (#171).
#   thread-sanitizer    — Disabled (if: false) since 2026-05-12.
#   sanitizers          — Address Sanitizer (VideoScanCore `swift test`; app
#                         unit tests only on manual dispatch with asan_app)
#                         and Undefined Behavior Sanitizer (app unit tests),
#                         one matrix leg each. Reporting jobs: a sanitizer hit
#                         or a failing test never fails them; only a broken
#                         build, or a run in which no test executed, does.
#   lint-strict         — SwiftLint --strict + Periphery.
#   source-ratchets     — Build-free source ratchets (pure Python, ubuntu):
#                         subprocess-injection + check-then-act on removable
#                         volumes, both against grandfathered baselines in
#                         ci/baselines/. Fails only on NEW violations.
#   findings-to-issues  — (after the above) tools/nightly_findings_to_issues.py:
#                         one issue per HIGH/MEDIUM finding fingerprint (cap
#                         10/night), one rolling digest per tool for LOW.
#                         DRY RUN unless repo variable NIGHTLY_FINDINGS_WRITE
#                         is 'true' AND the ref is main. The dry run publishes
#                         the full plan (would-open/comment/close + digest
#                         bodies) as an artifact and to the morning brief.
#   aggregate           — (last) Collects every count and appends one row to
#                         metrics/static_analysis.jsonl on the metrics branch,
#                         and publishes metrics/nightly_findings_latest.json
#                         for scripts/morning_metrics.sh. Pushes only on main.
#
# Findings appear in:
#   1. Each run's Summary panel (markdown — green or expandable details)
#   2. Security → Code Scanning (CodeQL alerts, deduped over time)
#   3. GitHub issues labelled `nightly-finding` (+ tool, + High Priority)
#   4. metrics/static_analysis.jsonl (history for the dashboard)
#
# A FINDING NEVER FAILS THIS WORKFLOW. Jobs go red for broken pipelines
# (build failed, artifact unreadable, gh call failed), for the CodeQL
# extraction floor, and for the ratchets' NEW-violation gates.

on:
  schedule:
    # 05:00 UTC daily — that's 01:00 EDT in summer, 00:00 EST in winter.
    # GitHub schedules can drift by minutes under load.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Findings → issues: plan only, write nothing (always on for non-main refs)'
        type: boolean
        default: false
      only:
        description: 'Comma list of jobs to run (blank = all): strict-concurrency,codeql,sanitizers,lint-strict,lint-warn,source-ratchets'
        type: string
        default: ''
      asan_app:
        description: 'ASan: also run the APP unit tests (VideoScanTests). Off by default — exceeded 200 min on 2026-10-01'
        type: boolean
        default: false

permissions:
  contents: write          # needed for the metrics push step
  security-events: write   # needed for CodeQL SARIF upload

jobs:

  # -------------------------------------------------------------------
  strict-concurrency:
    name: Swift strict concurrency (max)
    if: ${{ !inputs.only || contains(format(',{0},', inputs.only), ',strict-concurrency,') }}
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      # warning_count = concurrency-class findings only.
      #
      # The -warn-long-* perf-timing lines used to be worse than noisy — they
      # were INVISIBLE. The bucket grep matched the FLAG names
      # ("warn-long-function-bodies"), but the compiler's warning text never
      # contains them; it says "took 254ms to type-check (limit: 100ms)". So
      # perf-findings.txt was empty every single night while 98 real timing
      # warnings hid in the "other" bucket (found 2026-09-13). Fixed below.
      #
      # They are now parsed properly by scripts/typecheck_timing_ratchet.py,
      # which keys each finding by FUNCTION IDENTITY (file + symbol) and
      # carries the millisecond value as data. That is what makes the trend
      # readable: the same slow function is the same entry night over night,
      # instead of sort -u re-counting it whenever the timing jittered.
      warning_count: ${{ steps.count.outputs.concurrency }}
      warning_total: ${{ steps.count.outputs.warnings }}
      memory_safety_count: ${{ steps.count.outputs.memory_safety }}
      memory_safety_supported: ${{ steps.memsafe.outputs.supported }}
      # The findings job keys "is this tool's report complete?" on the BUILD,
      # not the job: the type-check ratchet below can fail the job on a slow
      # new function while the warning list is still whole.
      build_outcome: ${{ steps.build.outcome }}
      memsafe_outcome: ${{ steps.memsafe_build.outcome }}
      typecheck_identities: ${{ steps.typecheck.outputs.typecheck_identities }}
      typecheck_new_slow: ${{ steps.typecheck.outputs.typecheck_new_over_threshold }}
      typecheck_saturated: ${{ steps.typecheck.outputs.typecheck_saturated }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      # Swift 6.2 strict memory safety (SE-0458): flags every use of an
      # unsafe construct (UnsafePointer, unowned(unsafe), @unsafe APIs …)
      # that is not acknowledged with `unsafe`. Warnings only, by design of
      # the feature, so it is safe to report on. PROBED rather than assumed:
      # the flag is passed to the build only if this toolchain's swiftc
      # accepts it. The probe also records whether it really diagnoses an
      # unsafe use, so a flag that is accepted but inert does not count as
      # coverage.
      - name: Probe -strict-memory-safety support
        id: memsafe
        run: |
          printf 'func peek(_ p: UnsafePointer<Int>) -> Int { p.pointee }\n' > memsafe-probe.swift
          echo "swiftc: $(xcrun swiftc --version 2>&1 | head -1)" | tee memsafe-probe.txt
          if xcrun swiftc -typecheck -strict-memory-safety memsafe-probe.swift >> memsafe-probe.txt 2>&1; then
            cat memsafe-probe.txt
            if tail -n +2 memsafe-probe.txt | grep -qi 'unsafe'; then
              echo "supported=yes" >> "$GITHUB_OUTPUT"
            else
              echo "supported=inert" >> "$GITHUB_OUTPUT"
              echo "::warning::swiftc accepted -strict-memory-safety but did not diagnose the probe; memory-safety counts will read 0 and are not evidence"
            fi
            echo "flag=-strict-memory-safety" >> "$GITHUB_OUTPUT"
          else
            cat memsafe-probe.txt
            echo "supported=no" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::warning::this toolchain's swiftc rejects -strict-memory-safety; the strict build runs without it"
          fi

      - name: Build with strict concurrency + all upcoming features + perf warnings
        id: build
        run: |
          set -o pipefail
          # Every Swift "upcoming feature" we can flip on as a warning.
          # `enable-upcoming-feature` opts a code path into Swift 6 semantics
          # while staying on Swift 5 — perfect for nightly reporting.
          #
          # NOTE: `InternalImportsByDefault` is intentionally OMITTED from
          # this list. Enabling it triggers a hard build error in
          # swift-numerics (transitive dep via Charts):
          #   Double+Real.swift:N: error: 'libm_cos' is internal and cannot
          #   be referenced from a '@_transparent' function
          # That's an upstream issue in swift-numerics's @_transparent
          # libm shims when InternalImports is enabled; not our code.
          # Revisit once swift-numerics is bumped past the fixed release
          # (https://github.com/apple/swift-numerics — track @_transparent
          # cleanup). See bug-fix dispatch 2026-06-02.
          UPCOMING_FLAGS=""
          for feat in BareSlashRegexLiterals ConciseMagicFile \
                      ForwardTrailingClosures ImplicitOpenExistentials \
                      StrictConcurrency ImportObjcForwardDeclarations \
                      DisableOutwardActorInference IsolatedDefaultValues \
                      GlobalConcurrency InferSendableFromCaptures \
                      RegionBasedIsolation ExistentialAny \
                      DeprecateApplicationMain; do
            UPCOMING_FLAGS+=" -Xfrontend -enable-upcoming-feature -Xfrontend $feat"
          done
          # Compiler-side perf cliffs (type-inference >100ms).
          PERF_FLAGS=" -Xfrontend -warn-long-function-bodies=100 -Xfrontend -warn-long-expression-type-checking=100"
          # Concurrency reporting flags.
          CONCUR_FLAGS=" -Xfrontend -warn-concurrency -Xfrontend -enable-actor-data-race-checks"
          # -strict-memory-safety is deliberately NOT here; see the next step.

          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_STRICT_CONCURRENCY=complete \
            OTHER_SWIFT_FLAGS="\$(inherited)$CONCUR_FLAGS$UPCOMING_FLAGS$PERF_FLAGS" \
            2>&1 | tee strict-concurrency.log
          if grep -q "BUILD FAILED" strict-concurrency.log; then
            echo "::error::Build itself failed (not a warning issue) — see log"
            exit 1
          fi

      # Strict memory safety gets its OWN build (2026-10-01). The type-check
      # timing ratchet below gates on the build above, and its baseline was
      # measured without this flag. Keeping that build byte-for-byte what it
      # was keeps the timing trend comparable. (Validation: with the flag
      # folded in, run 36934781080 tripped the 500 ms gate on
      # personCardEntry at 505 ms; without it, run 36940500880 passed, yet
      # timings were still ×1.17 vs the 10-01 nightly. So that trip was
      # mostly runner jitter on a function sitting at the gate, not the
      # flag.) Costs ~7 runner minutes. Reporting only: continue-on-error,
      # and its outcome is the memory-safety tool's completeness in the
      # findings job.
      - name: Build with strict memory safety (SE-0458), warnings only
        id: memsafe_build
        if: steps.build.outcome == 'success' && steps.memsafe.outputs.flag != ''
        continue-on-error: true
        run: |
          # Outcome = whether the build finished (grep on the last line),
          # not xcodebuild's exit code, which `|| true` absorbs.
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath memsafe-dd \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            OTHER_SWIFT_FLAGS="\$(inherited) -strict-memory-safety" \
            > memsafe-build.log 2>&1 || true
          tail -5 memsafe-build.log
          grep -q "BUILD SUCCEEDED" memsafe-build.log

      - name: Count + summarise findings
        id: count
        if: always()
        env:
          MEMSAFE_SUPPORTED: ${{ steps.memsafe.outputs.supported }}
          MEMSAFE_BUILD: ${{ steps.memsafe_build.outcome }}
        run: |
          # SE-0458 diagnostics carry the [#StrictMemorySafety] group tag in
          # Swift 6.2.4 (seen on the runner 2026-10-01); the phrase
          # alternatives are a fallback for a toolchain that omits the tag.
          # They come from the separate memory-safety build, and are also
          # excluded from this build's buckets in case they ever appear here.
          MS_RE="\[#StrictMemorySafety\]|unsafe constructs|involves unsafe|not marked with 'unsafe'|@unsafe"
          CONC_RE='(sendable|data race|actor-isolated|concurrency|main actor|nonisolated|@Sendable)'
          if [ -f memsafe-build.log ]; then
            grep -E ': warning: ' memsafe-build.log | grep -E "$MS_RE" | sort -u > memory-safety-findings.txt || true
          else
            : > memory-safety-findings.txt
          fi
          if [ -f strict-concurrency.log ]; then
            grep -E ': warning: ' strict-concurrency.log | sort -u > all-warnings.txt || true
            grep -E "$CONC_RE" all-warnings.txt | grep -Ev "$MS_RE" > concurrency-findings.txt || true
            # Match the WARNING TEXT, not the flag name. The old pattern
            # ('warn-long-function-bodies') never appears in compiler output,
            # so this bucket read 0 every night since the job was written.
            grep -E 'took [0-9]+ms to type-check' all-warnings.txt > perf-findings.txt || true
            grep -Ev '(sendable|data race|actor-isolated|concurrency|main actor|nonisolated|@Sendable|took [0-9]+ms to type-check)' all-warnings.txt | grep -Ev "$MS_RE" > other-findings.txt || true
            # The saturated case is an ERROR, not a warning, so it is not in
            # all-warnings.txt. It is the shape that turned CI red on
            # 2026-09-01 (CatalogView.body, 495 lines, compiles on the M4 and
            # not on the runner), so pull it out of the raw log separately.
            grep -E 'unable to type-check this expression in reasonable time' strict-concurrency.log | sort -u > typecheck-saturated.txt || true
          else
            : > all-warnings.txt; : > concurrency-findings.txt; : > perf-findings.txt; : > other-findings.txt; : > typecheck-saturated.txt
          fi

          C_COUNT=$(wc -l < concurrency-findings.txt | tr -d ' ')
          P_COUNT=$(wc -l < perf-findings.txt | tr -d ' ')
          O_COUNT=$(wc -l < other-findings.txt | tr -d ' ')
          M_COUNT=$(wc -l < memory-safety-findings.txt | tr -d ' ')
          TOTAL=$(wc -l < all-warnings.txt | tr -d ' ')
          echo "warnings=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "concurrency=$C_COUNT" >> "$GITHUB_OUTPUT"
          # Not a number unless the flag was live AND its build finished: a 0
          # would claim "no unsafe code", which nobody measured.
          if [ "$MEMSAFE_SUPPORTED" = "yes" ] && [ "$MEMSAFE_BUILD" = "success" ]; then
            echo "memory_safety=$M_COUNT" >> "$GITHUB_OUTPUT"
            M_CELL="$M_COUNT"
          else
            M_CELL="n/a (flag ${MEMSAFE_SUPPORTED:-not probed}, build ${MEMSAFE_BUILD:-skipped})"
          fi

          {
            echo "## Swift strict concurrency (max)"
            echo ""
            echo "| Category | Count |"
            echo "|---|---:|"
            echo "| Concurrency / Sendable / data race | $C_COUNT |"
            echo "| Strict memory safety (SE-0458) | $M_CELL |"
            echo "| Compile-time perf (>100ms type check) | $P_COUNT |"
            echo "| Upcoming-feature / other | $O_COUNT |"
            echo "| **Total** | **$TOTAL** |"
            echo ""
            for label_file in "Concurrency:concurrency-findings.txt" "MemorySafety:memory-safety-findings.txt" "Perf:perf-findings.txt" "Other:other-findings.txt"; do
              label="${label_file%%:*}"
              file="${label_file##*:}"
              n=$(wc -l < "$file" | tr -d ' ')
              if [ "$n" != "0" ]; then
                echo "<details><summary>$label findings ($n)</summary>"
                echo ""
                echo '```'
                head -200 "$file"
                if [ "$n" -gt 200 ]; then echo "... (truncated, see artifact for full list)"; fi
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------
      # The type-check timing metric, made readable.
      #
      # Parses every "took NNNms to type-check" warning (and the saturated
      # "unable to type-check ... in reasonable time" error) and keys each one
      # by FUNCTION IDENTITY — file + symbol — with the millisecond value as
      # data rather than part of the key. That produces a top-20 list that is
      # the same list tomorrow, and turns "a new function crossed the line"
      # into a real event.
      #
      # THIS STEP CAN FAIL THE JOB, and it is not a build failure when it
      # does: it means a NEW function type-checks slower than the threshold in
      # scripts/typecheck_timing_ratchet.py (NEW_FUNCTION_THRESHOLD_MS, 500).
      # Known-slow entries are grandfathered in ci/baselines/typecheck_timing.json
      # and entries that merely got slower are reported, never gated — gating
      # on a jittering millisecond value would rebuild the exact noise this
      # replaces.
      - name: Type-check timing (identity-keyed) + ratchet
        id: typecheck
        if: always()
        run: |
          python3 scripts/typecheck_timing_ratchet.py strict-concurrency.log \
            --json-out typecheck-timing.json \
            --top-out typecheck-top20.txt

      - name: Upload concurrency artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-concurrency-log
          path: |
            strict-concurrency.log
            all-warnings.txt
            concurrency-findings.txt
            memory-safety-findings.txt
            memsafe-probe.txt
            perf-findings.txt
            other-findings.txt
            typecheck-saturated.txt
            typecheck-timing.json
            typecheck-top20.txt
          retention-days: 30

  # -------------------------------------------------------------------
  codeql:
    name: CodeQL (Swift, security-and-quality)
    if: ${{ !inputs.only || contains(format(',{0},', inputs.only), ',codeql,') }}
    runs-on: macos-15
    # 120, not 60. On 2026-10-01 (run 36854243185) the extraction build
    # alone took 49.6 minutes and the job 56.7 — three minutes from a
    # timeout that would have read as "CodeQL broke".
    timeout-minutes: 120
    outputs:
      finding_count: ${{ steps.count.outputs.findings }}
      extracted_files: ${{ steps.coverage.outputs.extracted }}
      in_scope_files: ${{ steps.coverage.outputs.in_scope }}
      extraction_errors: ${{ steps.coverage.outputs.extraction_errors }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          # `manual` mode tells CodeQL to extract from our explicit build
          # below rather than racing its own autobuild. Previously the
          # SARIF showed 177 "cannot find type 'PhotosPickerItem' in scope"
          # indexer errors and 0 results — autobuild was producing a
          # partial AST that the analyse step then queried.
          build-mode: manual
          queries: security-and-quality

      - name: Build for CodeQL
        run: |
          # pipefail: a failed build used to hide behind `| tail` and let
          # CodeQL "succeed" on 1 of 1,283 files (GH #171).
          #
          # Explicitly built modules OFF (2026-09-09, GH #171 attempt 8):
          # with the build green, CodeQL still scanned 82 of 1,311 files.
          # The SARIF carried 1,875 extractor errors of one shape — "module
          # file …/ModuleCache.noindex/_DarwinFoundation1-….pcm built from a
          # different branch (clang-1700.6.4.2) than the compiler
          # (swiftlang/llvm-project …)" and "failed to emit precompiled
          # module '/dev/null'". Xcode 26 precompiles the SDK's clang
          # modules itself and hands them to swift-frontend as explicit
          # inputs; CodeQL's extractor is a different frontend build and
          # refuses those PCMs, so every file that imports Foundation is
          # dropped. With implicit modules the extractor builds its own.
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            _EXPERIMENTAL_SWIFT_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            2>&1 | tail -300

      - name: Analyse with CodeQL
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:swift'
          upload: always
          output: codeql-results

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          COUNT=0
          if [ -d codeql-results ]; then
            for sarif in codeql-results/*.sarif; do
              [ -f "$sarif" ] || continue
              N=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" "$sarif")
              COUNT=$((COUNT + N))
            done
          fi
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## CodeQL (Swift, security-and-quality)"
            echo ""
            if [ "$COUNT" = "0" ]; then
              echo "✅ **No CodeQL findings.**"
            else
              echo "⚠️ **$COUNT CodeQL findings.** Triage in **Security → Code Scanning**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # GH #171: "0 alerts" from a scan that extracted 1 file is not
      # evidence. Count the files CodeQL actually extracted (the per-file
      # successfully-extracted-files diagnostics in the SARIF) against the
      # tracked app + VideoScanCore sources, and FAIL below 80%. Fails closed:
      # a missing SARIF, or one without those diagnostics, fails too. The
      # status file tells the findings job whether tonight's CodeQL report
      # was whole. If it was not, CodeQL issues are not counted as "gone".
      - name: Extraction coverage floor (GH #171)
        id: coverage
        if: always()
        run: |
          mkdir -p codeql-results
          set +e
          python3 scripts/codeql_extraction_floor.py codeql-results/swift.sarif \
            --floor 0.80 --json-out codeql-results/codeql-coverage.json
          RC=$?
          set -e
          python3 -c "import json,sys; json.dump({'tool':'codeql','complete':sys.argv[1]=='0'}, open('codeql-results/nightly-status-codeql.json','w'))" "$RC"
          exit $RC

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 30

  # -------------------------------------------------------------------
  thread-sanitizer:
    name: Thread Sanitizer (Mac/self-hosted only)
    if: false
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      issue_count: ${{ steps.count.outputs.tsan_issues }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Run unit tests under TSan
        run: |
          echo "TSan is disabled on GH-hosted macOS runners. Run on local/self-hosted Mac hardware."
          # This is a *reporting* job — we want to capture TSan output
          # even when tests fail. Tests can fail under instrumentation
          # because TSan exposes real races, slows execution enough to
          # blow timeouts, or both. We don't want any of those to mask
          # the report. Final `|| true` swallows xcodebuild's non-zero
          # exit; the count step below is authoritative.
          xcodebuild test \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:VideoScanTests \
            -enableThreadSanitizer YES \
            -resultBundlePath TSanResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee tsan.log || true

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          if [ -f tsan.log ]; then
            grep -E "ThreadSanitizer: " tsan.log | sort -u > tsan-findings.txt || true
            # Also pull the list of tests that failed under instrumentation.
            grep -E "^Test case '.*' failed on" tsan.log | sort -u > tsan-failed-tests.txt || true
          else
            : > tsan-findings.txt; : > tsan-failed-tests.txt
          fi
          COUNT=$(wc -l < tsan-findings.txt | tr -d ' ')
          FAILED_TESTS=$(wc -l < tsan-failed-tests.txt | tr -d ' ')
          echo "tsan_issues=$COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Thread Sanitizer"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| TSan race reports | $COUNT |"
            echo "| Tests failing under instrumentation | $FAILED_TESTS |"
            echo ""
            if [ "$COUNT" != "0" ]; then
              echo "<details><summary>TSan race reports ($COUNT)</summary>"
              echo ""
              echo '```'
              head -200 tsan-findings.txt
              if [ "$COUNT" -gt 200 ]; then echo "... (truncated)"; fi
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            if [ "$FAILED_TESTS" != "0" ]; then
              echo "<details><summary>Failed tests under TSan ($FAILED_TESTS)</summary>"
              echo ""
              echo '```'
              head -100 tsan-failed-tests.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TSan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: |
            tsan.log
            tsan-findings.txt
            TSanResults.xcresult
          retention-days: 30

  # -------------------------------------------------------------------
  # Address Sanitizer and Undefined Behavior Sanitizer (added 2026-10-01).
  #
  # Same shape as the TSan job above, but ENABLED. One matrix leg each:
  #
  #   ASan (nightly)  `swift test --sanitize=address` over VideoScanCore:
  #                   ~720 package tests (fixity, ledger, GEDCOM …), with a
  #                   45-minute step timeout.
  #   ASan app tests  ONLY on a manual dispatch with asan_app=true. The full
  #                   VideoScanTests run under ASan exceeded its 200-minute
  #                   step timeout on the first try (run 36934781080, 00:03 →
  #                   03:23Z). The UBSan leg ran the same suite in 41 minutes.
  #                   Whether that was slowness or a hang is not known yet;
  #                   try it by hand before putting it back on the schedule
  #                   (Manager ruling 2026-10-01).
  #   UBSan           build-for-testing + test-without-building over
  #                   VideoScanTests (VideoScan-CI plan, UI targets excluded).
  #
  # Reporting jobs: failing tests, a sanitizer abort or a step timeout never
  # fail them (continue-on-error). They fail only for a broken build, or a
  # run in which nothing executed and nothing was reported.
  #
  # A timeout, an ASan abort, or too few suites marks the tool INCOMPLETE in
  # nightly-status-<tool>.json. The findings job then counts none of that
  # tool's issues as gone and closes nothing.
  #
  # Scope, stated plainly so a zero is not over-read:
  #   * ASan instruments Swift, C and C++. It stops the process at the first
  #     error, so a night with an ASan hit has not run the tests after it.
  #     That night is marked incomplete.
  #   * UBSan in Xcode is a clang feature: it instruments C, C++ and ObjC
  #     (our few .c/.m files and C/C++ packages such as mlx-swift's Cmlx),
  #     NOT Swift. Swift's own overflow and bounds traps already run in
  #     Debug. So there is no Swift Core leg for UBSan.
  sanitizers:
    name: ${{ matrix.label }} (unit tests)
    if: ${{ !inputs.only || contains(format(',{0},', inputs.only), ',sanitizers,') }}
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: asan
            label: Address Sanitizer
            xcflag: -enableAddressSanitizer
            spm: address
            artifact: sanitizer-address
            pattern: 'SUMMARY: AddressSanitizer: '
          - tool: ubsan
            label: Undefined Behavior Sanitizer
            xcflag: -enableUndefinedBehaviorSanitizer
            spm: ''
            artifact: sanitizer-undefined
            pattern: ': runtime error: '

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Several tests spawn real ffmpeg/ffprobe, in the app and in
      # VideoScanCore (FFmpegPreviewRendererE2ETests), as in ci.yml.
      - name: Install FFmpeg
        run: |
          brew install ffmpeg || true
          ffmpeg -version | head -1

      # Same component download as the other jobs. Unlike them, the app
      # build here does NOT exclude *.metal: the tests run the real app host,
      # and ci.yml's green test build compiles the kernels too.
      - name: Download Metal Toolchain (mlx-swift kernels)
        if: matrix.tool != 'asan' || inputs.asan_app
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal

      - name: Build for testing (${{ matrix.label }})
        if: matrix.tool != 'asan' || inputs.asan_app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            ${{ matrix.xcflag }} YES \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee build-${{ matrix.tool }}.txt | tail -200
          if grep -q "BUILD FAILED" build-${{ matrix.tool }}.txt; then
            echo "::error::${{ matrix.label }} build failed (pipeline, not a finding)"
            grep 'error:' build-${{ matrix.tool }}.txt | head -20
            exit 1
          fi

      - name: App unit tests under ${{ matrix.label }}
        id: test
        if: matrix.tool != 'asan' || inputs.asan_app
        continue-on-error: true
        timeout-minutes: 200
        shell: bash
        run: |
          # TEST_RUNNER_ prefix: xcodebuild strips it and hands the variable
          # to the test host, which uses it for GitHub timing budgets. It
          # also arms the CI canary, whose expected failure is ignored here.
          set +e
          TEST_RUNNER_GITHUB_ACTIONS=true \
          xcodebuild test-without-building \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -testPlan VideoScan-CI \
            -only-testing:VideoScanTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            ${{ matrix.xcflag }} YES \
            -enableCodeCoverage NO \
            -resultBundlePath Sanitizer-${{ matrix.tool }}.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            > sanitizer-${{ matrix.tool }}.log 2>&1
          echo "xcodebuild exit $?" | tee test-exit.txt
          tail -40 sanitizer-${{ matrix.tool }}.log
          exit 0

      - name: VideoScanCore package tests under ${{ matrix.label }}
        id: core
        if: matrix.spm != ''
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          swift test --package-path VideoScan/VideoScanCore --sanitize=${{ matrix.spm }} \
            > core-sanitizer-${{ matrix.tool }}.log 2>&1
          echo "swift test exit $?" | tee core-exit.txt
          tail -40 core-sanitizer-${{ matrix.tool }}.log
          exit 0

      - name: Count + summarise findings
        id: count
        if: always()
        shell: bash
        env:
          TOOL: ${{ matrix.tool }}
          LABEL: ${{ matrix.label }}
          PATTERN: ${{ matrix.pattern }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
        run: |
          LOG="sanitizer-$TOOL.log"
          CORE="core-sanitizer-$TOOL.log"
          touch "$LOG"
          cat "$LOG" $( [ -f "$CORE" ] && echo "$CORE" ) | grep -F "$PATTERN" | sort -u > sanitizer-findings.txt || true
          grep -E '^(✘ Test .*failed after|Test Case .*failed)' "$LOG" | grep -v 'mustFail()\|Test run with' | sort -u > failed-tests.txt || true
          COUNT=$(wc -l < sanitizer-findings.txt | tr -d ' ')
          FAILED=$(wc -l < failed-tests.txt | tr -d ' ')
          SUITES=$(grep -cE '^(◇ Suite |Test Suite .*started)' "$LOG" || true)
          SUITES=${SUITES:-0}
          # A Core run counts as having happened when swift test printed a
          # run total, from XCTest ("Executed N tests") or Swift Testing
          # ("Test run with N tests").
          CORE_RAN=0
          if [ -f "$CORE" ] && grep -qE 'Executed [0-9]+ tests?|Test run with [0-9]+ tests?' "$CORE"; then CORE_RAN=1; fi

          # Complete = every part that was scheduled ran to the end (no
          # timeout), the app part (if any) started enough suites to be a
          # real run, and, for ASan, nothing aborted early.
          APP_OK=true
          if [ "${TEST_OUTCOME:-skipped}" != "skipped" ]; then
            if [ "$TEST_OUTCOME" != "success" ] || [ "$SUITES" -lt 20 ]; then APP_OK=false; fi
          fi
          CORE_OK=true
          if [ "${CORE_OUTCOME:-skipped}" != "skipped" ]; then
            if [ "$CORE_OUTCOME" != "success" ] || [ "$CORE_RAN" = "0" ]; then CORE_OK=false; fi
          fi
          COMPLETE=false
          if [ "$APP_OK" = "true" ] && [ "$CORE_OK" = "true" ]; then
            if [ "$TOOL" != "asan" ] || [ "$COUNT" = "0" ]; then COMPLETE=true; fi
          fi
          python3 -c "import json,sys; json.dump({'tool':sys.argv[1],'complete':sys.argv[2]=='true','suites_started':int(sys.argv[3]),'core_ran':sys.argv[8]=='1','reports':int(sys.argv[4]),'failed_tests':int(sys.argv[5]),'test_step':sys.argv[6],'core_step':sys.argv[7]}, open(f'nightly-status-{sys.argv[1]}.json','w'))" \
            "$TOOL" "$COMPLETE" "$SUITES" "$COUNT" "$FAILED" "${TEST_OUTCOME:-skipped}" "${CORE_OUTCOME:-skipped}" "$CORE_RAN"
          cat "nightly-status-$TOOL.json"; echo

          {
            echo "## $LABEL"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Sanitizer reports (unique lines) | $COUNT |"
            echo "| App tests failing under instrumentation (canary excluded) | $FAILED |"
            echo "| App suites started | $SUITES |"
            echo "| App unit-test step | ${TEST_OUTCOME:-skipped} ($(cat test-exit.txt 2>/dev/null || echo 'not run')) |"
            echo "| VideoScanCore step | ${CORE_OUTCOME:-skipped} ($(cat core-exit.txt 2>/dev/null || echo 'not run')) |"
            echo "| Complete run (counts toward auto-close) | $COMPLETE |"
            echo ""
            if [ "$COUNT" != "0" ]; then
              echo "<details><summary>$LABEL reports ($COUNT)</summary>"
              echo ""
              echo '```'
              head -200 sanitizer-findings.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SUITES" = "0" ] && [ "$CORE_RAN" = "0" ] && [ "$COUNT" = "0" ]; then
            echo "::error::Nothing ran and nothing was reported: the $LABEL run did not happen (pipeline, not a finding)"
            exit 1
          fi

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            sanitizer-${{ matrix.tool }}.log
            core-sanitizer-${{ matrix.tool }}.log
            sanitizer-findings.txt
            failed-tests.txt
            nightly-status-${{ matrix.tool }}.json
          retention-days: 30

      - name: Upload sanitizer result bundle
        if: always() && (matrix.tool != 'asan' || inputs.asan_app)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-xcresult
          path: Sanitizer-${{ matrix.tool }}.xcresult
          retention-days: 7

  # -------------------------------------------------------------------
  lint-strict:
    name: SwiftLint --strict + Periphery aggressive
    if: ${{ !inputs.only || contains(format(',{0},', inputs.only), ',lint-strict,') }}
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      swiftlint_count: ${{ steps.count.outputs.swiftlint }}
      periphery_count: ${{ steps.count.outputs.periphery }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Install tools
        run: |
          brew install swiftlint || true
          # Use the homebrew-core formula (3.x), not the cask (stuck at 2.21.2).
          brew install periphery || true
          echo "Periphery: $(periphery version)"
          echo "SwiftLint: $(swiftlint version)"

      - name: SwiftLint --strict
        run: |
          # --strict promotes warnings to errors, but we just want to count
          # them. Don't fail the step on non-zero exit.
          swiftlint lint --strict --reporter xcode > swiftlint-strict.txt 2>&1 || true

      - name: Build (Periphery needs the build for index data)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath periphery-dd 2>&1 | tail -300

      # Fixed 2026-10-01. This step used to call `periphery scan --targets
      # VideoScan`. Periphery 3.x dropped `--targets` and exits with "Error:
      # Unknown option '--targets'", so periphery-strict.txt held 3 lines of
      # usage text and the "Periphery aggressive" count read 0 every night
      # (run 36854243185). Project, scheme and retain_public: false now come
      # from .periphery.yml. --skip-build reuses the index from the build
      # above. The exit code goes into a status file, so the findings job
      # knows whether tonight's list is whole.
      - name: Periphery aggressive (retain_public false via .periphery.yml)
        run: |
          set +e
          periphery scan \
            --skip-build \
            --index-store-path periphery-dd/Index.noindex/DataStore \
            --format xcode \
            > periphery-strict.txt 2>&1
          RC=$?
          set -e
          echo "periphery exit $RC"
          python3 -c "import json,sys; json.dump({'tool':'periphery','complete':sys.argv[1]=='0'}, open('nightly-status-periphery.json','w'))" "$RC"
          if [ "$RC" != "0" ]; then
            head -20 periphery-strict.txt
            echo "::warning::periphery exited $RC; its findings are not counted as complete tonight"
          fi

      - name: Count + summarise findings
        id: count
        if: always()
        run: |
          # `grep -c` already prints "0" on no-match (and exits 1).
          # Pairing that with `|| echo 0` was producing "0\n0" — a
          # multi-line value GH Actions then rejected as malformed
          # output ("Invalid format '0'"). Using `|| true` swallows
          # the exit code without re-printing.
          SL=$(grep -c ": warning:\|: error:" swiftlint-strict.txt 2>/dev/null || true)
          PF=$(grep -c "^/.*: warning: " periphery-strict.txt 2>/dev/null || true)
          SL=${SL:-0}
          PF=${PF:-0}
          echo "swiftlint=$SL" >> "$GITHUB_OUTPUT"
          echo "periphery=$PF" >> "$GITHUB_OUTPUT"

          {
            echo "## SwiftLint --strict + Periphery aggressive"
            echo ""
            echo "| Tool | Findings |"
            echo "|---|---:|"
            echo "| SwiftLint --strict | $SL |"
            echo "| Periphery (retain_public false) | $PF |"
            echo ""
            if [ "$SL" != "0" ]; then
              echo "<details><summary>SwiftLint findings ($SL)</summary>"
              echo ""
              echo '```'
              head -100 swiftlint-strict.txt
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            if [ "$PF" != "0" ]; then
              echo "<details><summary>Periphery findings ($PF)</summary>"
              echo ""
              echo '```'
              head -100 periphery-strict.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-strict
          path: |
            swiftlint-strict.txt
            periphery-strict.txt
            nightly-status-periphery.json
          retention-days: 30

  # -------------------------------------------------------------------
  # Warn-only SwiftLint + Periphery — historically lived in ci.yml on
  # every push. Moved here 2026-06-02 to keep per-push CI focused on
  # build+tests. Never fails the workflow; report is informational only.
  lint-warn:
    name: SwiftLint + Periphery (warn-only)
    if: ${{ !inputs.only || contains(format(',{0},', inputs.only), ',lint-warn,') }}
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.x required — the source uses Swift 6.2 isolated conformances.
      # See scripts/ci_select_xcode.sh for the history behind this.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      # Xcode 26 ships the Metal compiler as a downloadable component. The
      # GH runner image lacks it, and mlx-swift's Cmlx target has .metal
      # kernels, so every build in this workflow died since 2026-08-20 and
      # CodeQL scanned 1 of 1,283 files (GH #171). Idempotent; ~1-2 min.
      - name: Download Metal Toolchain (mlx-swift kernels)
        run: |
          set -o pipefail
          if ! xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3; then
            sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -3
          fi
          # The asset downloads fine but xcodebuild still said "missing
          # Metal Toolchain" on run 34284885188: the component is only
          # registered with the build service after first-launch runs.
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          xcodebuild -checkFirstLaunchStatus 2>&1 | tail -1 || true
          xcrun -f metal
          xcrun metal --version 2>&1 | head -1

      - name: Install tools
        run: |
          brew install swiftlint || true
          brew install periphery || true
          echo "Periphery: $(periphery version)"
          echo "SwiftLint: $(swiftlint version)"

      - name: SwiftLint (warn-only)
        run: |
          echo "## SwiftLint Report (warn-only)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter emoji 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter xcode > swiftlint-raw.txt 2>&1 || true

      - name: Build (Periphery needs index data)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath DerivedData 2>&1 | tail -300

      - name: Periphery (warn-only, default retention)
        continue-on-error: true
        run: |
          echo "## Periphery — unused code (warn-only)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          periphery scan \
            --skip-build \
            --index-store-path DerivedData/Index.noindex/DataStore \
            --format xcode \
            2>&1 | tee periphery-raw.txt | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload warn-only logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-warn
          path: |
            swiftlint-raw.txt
            periphery-raw.txt
          retention-days: 14

  # -------------------------------------------------------------------
  # Build-free source ratchets. Pure python3 stdlib over the .swift text, so
  # this needs no Xcode, no Metal toolchain and no 40-minute build — it runs
  # on ubuntu in well under a minute and reports even on the nights the macOS
  # build dies (which, per GH #171, is a thing that happens).
  #
  # Both checkers are GRANDFATHERED ratchets: today's hits are recorded in
  # ci/baselines/*.json and reported as pre-existing; the job goes red only on
  # a NEW violation or on a baseline entry that grew. We are not refactoring
  # 1,300 files tonight — we are stopping the bleeding.
  #
  # Run either one locally exactly as CI does:
  #   python3 scripts/check_subprocess_injection.py --root .
  #   python3 scripts/check_volume_check_then_act.py --root .
  # Accept a deliberate change with --update-baseline, and explain it in the
  # commit message.
  source-ratchets:
    name: Source ratchets (injection + check-then-act)
    if: ${{ !inputs.only || contains(format(',{0},', inputs.only), ',source-ratchets,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      injection_new: ${{ steps.injection.outputs.new_count }}
      injection_baseline: ${{ steps.injection.outputs.pre_existing_count }}
      checkthenact_new: ${{ steps.checkthenact.outputs.new_count }}
      checkthenact_baseline: ${{ steps.checkthenact.outputs.pre_existing_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pins the property that VideoScan never builds a shell command STRING:
      # ProcessRunner sets executableURL + an arguments ARRAY (posix_spawn with
      # a real argv), so there is no string for an injection to live in. Also
      # pins the ffmpeg concat-demuxer escaping, the one place our data reaches
      # a parser we do not control.
      - name: Subprocess-injection ratchet
        id: injection
        run: |
          python3 scripts/check_subprocess_injection.py \
            --root . \
            --json-out ratchet-injection.json

      # Reliability, not security: a removable volume can vanish between
      # "does this exist?" and the write. Fix template is the descriptor copy
      # in PromoteToArchiveJob / ArchivePromoteEngine.
      - name: Check-then-act on removable volumes
        id: checkthenact
        if: always()
        run: |
          python3 scripts/check_volume_check_then_act.py \
            --root . \
            --json-out ratchet-check-then-act.json

      - name: Upload ratchet findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ratchets
          path: |
            ratchet-injection.json
            ratchet-check-then-act.json
            ci/baselines/subprocess_injection.json
            ci/baselines/volume_check_then_act.json
          retention-days: 30

  # -------------------------------------------------------------------
  # Nightly findings → GitHub issues (Rick, 2026-10-01; Manager rulings the
  # same night). Design, severity rules and state model: the docstring of
  # tools/nightly_findings_to_issues.py.
  #
  # WRITES ARE OFF until Rick has read a dry run. They happen only when ALL
  # of these hold:
  #   * repo variable NIGHTLY_FINDINGS_WRITE is exactly 'true' (Settings →
  #     Secrets and variables → Actions → Variables). Unset = dry run.
  #   * the ref is main (branch validation runs are always dry)
  #   * a manual dispatch did not ask for dry_run
  # A dry run still reads the real issues and plans everything. The plan
  # (would-open / would-comment / would-close + every digest body) goes to
  # the `nightly-findings-plan` artifact, and the summary JSON goes to
  # metrics/nightly_findings_latest.json for the morning brief.
  #
  # Each tool's "complete" verdict comes from its job result (or, for the
  # strict build, the build step's outcome) AND the nightly-status-*.json
  # its job uploaded. An incomplete tool's issues are never counted as gone.
  findings-to-issues:
    name: Findings → GitHub issues
    needs: [strict-concurrency, codeql, thread-sanitizer, sanitizers, lint-strict]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      new_high: ${{ steps.file.outputs.new_high }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download analysis artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          for a in codeql-results strict-concurrency-log tsan-log sanitizer-address sanitizer-undefined lint-strict; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$a" -D "artifacts/$a"; then
              echo "downloaded $a"
            else
              echo "::notice::artifact $a not present in this run (its job was skipped or failed early)"
            fi
          done
          find artifacts -maxdepth 2 -type f | sort

      - name: File / update / close issues
        id: file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITE: ${{ (vars.NIGHTLY_FINDINGS_WRITE == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run) && 'true' || 'false' }}
        run: |
          ARGS=()
          if [ "$WRITE" != "true" ]; then
            ARGS+=(--dry-run)
            echo "DRY RUN: no issue will be written (NIGHTLY_FINDINGS_WRITE='${{ vars.NIGHTLY_FINDINGS_WRITE }}', ref=$GITHUB_REF)"
          fi
          python3 tools/nightly_findings_to_issues.py \
            --artifacts artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --job-result "codeql=${{ needs.codeql.result }}" \
            --job-result "strict-concurrency=${{ needs.strict-concurrency.outputs.build_outcome || 'skipped' }}" \
            --job-result "memory-safety=${{ needs.strict-concurrency.outputs.memsafe_outcome || 'skipped' }}" \
            --job-result "tsan=${{ needs.thread-sanitizer.result }}" \
            --job-result "asan=${{ needs.sanitizers.result }}" \
            --job-result "ubsan=${{ needs.sanitizers.result }}" \
            --job-result "periphery=${{ needs.lint-strict.result }}" \
            --summary-out nightly-findings-summary.json \
            --plan-out nightly-findings-plan.md \
            "${ARGS[@]}"
          python3 -c "import json; s=json.load(open('nightly-findings-summary.json')); print('new_high=%d' % len(s['new_high']))" >> "$GITHUB_OUTPUT"

      - name: Upload findings summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-findings-summary
          path: nightly-findings-summary.json
          retention-days: 30

      - name: Upload planned issue changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-findings-plan
          path: nightly-findings-plan.md
          retention-days: 30

  # -------------------------------------------------------------------
  aggregate:
    name: Aggregate & push to metrics branch
    needs: [strict-concurrency, codeql, thread-sanitizer, sanitizers, lint-strict, source-ratchets, findings-to-issues]
    if: always()
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout (full history — need metrics branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch findings summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nightly-findings-summary
          path: findings-summary

      - name: Build aggregate row
        env:
          CONCURRENCY_WARNINGS: ${{ needs.strict-concurrency.outputs.warning_count }}
          STRICT_WARNING_TOTAL: ${{ needs.strict-concurrency.outputs.warning_total }}
          MEMORY_SAFETY: ${{ needs.strict-concurrency.outputs.memory_safety_count }}
          CODEQL_FINDINGS: ${{ needs.codeql.outputs.finding_count }}
          CODEQL_EXTRACTED: ${{ needs.codeql.outputs.extracted_files }}
          CODEQL_IN_SCOPE: ${{ needs.codeql.outputs.in_scope_files }}
          CODEQL_EXTRACTION_ERRORS: ${{ needs.codeql.outputs.extraction_errors }}
          TSAN_ISSUES: ${{ needs.thread-sanitizer.outputs.issue_count }}
          SWIFTLINT_STRICT: ${{ needs.lint-strict.outputs.swiftlint_count }}
          PERIPHERY_AGGRESSIVE: ${{ needs.lint-strict.outputs.periphery_count }}
          TYPECHECK_IDENTITIES: ${{ needs.strict-concurrency.outputs.typecheck_identities }}
          TYPECHECK_NEW_SLOW: ${{ needs.strict-concurrency.outputs.typecheck_new_slow }}
          TYPECHECK_SATURATED: ${{ needs.strict-concurrency.outputs.typecheck_saturated }}
          RATCHET_INJECTION_NEW: ${{ needs.source-ratchets.outputs.injection_new }}
          RATCHET_CHECKTHENACT_NEW: ${{ needs.source-ratchets.outputs.checkthenact_new }}
        run: |
          # One python step instead of a printf with 13 positional %s: every
          # value is either an int or null, and a sanitizer/finding count
          # comes from the findings summary (matrix jobs cannot export
          # per-leg outputs).
          python3 - <<'PY'
          import json, os, datetime
          def num(k):
              v = os.environ.get(k, "")
              try:
                  return int(v)
              except ValueError:
                  return None
          summ = {}
          try:
              summ = json.load(open("findings-summary/nightly-findings-summary.json"))
          except (OSError, ValueError):
              pass
          tools = summ.get("tools", {})
          def tool_findings(t):
              r = tools.get(t) or {}
              return r.get("findings") if r.get("input") else None
          row = {
              "ts": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "sha": os.environ["GITHUB_SHA"][:8],
              "run_kind": "nightly",
              "concurrency_warnings": num("CONCURRENCY_WARNINGS"),
              "strict_warning_total": num("STRICT_WARNING_TOTAL"),
              "memory_safety_warnings": num("MEMORY_SAFETY"),
              "codeql_findings": num("CODEQL_FINDINGS"),
              "codeql_extracted_files": num("CODEQL_EXTRACTED"),
              "codeql_in_scope_files": num("CODEQL_IN_SCOPE"),
              "codeql_extraction_errors": num("CODEQL_EXTRACTION_ERRORS"),
              "tsan_issues": num("TSAN_ISSUES"),
              "asan_issues": tool_findings("asan"),
              "ubsan_issues": tool_findings("ubsan"),
              "swiftlint_strict": num("SWIFTLINT_STRICT"),
              "periphery_aggressive": num("PERIPHERY_AGGRESSIVE"),
              "typecheck_identities": num("TYPECHECK_IDENTITIES"),
              "typecheck_new_slow": num("TYPECHECK_NEW_SLOW"),
              "typecheck_saturated": num("TYPECHECK_SATURATED"),
              "ratchet_injection_new": num("RATCHET_INJECTION_NEW"),
              "ratchet_check_then_act_new": num("RATCHET_CHECKTHENACT_NEW"),
              "nightly_finding_fingerprints": summ.get("fingerprints"),
              "nightly_findings_new_high": len(summ["new_high"]) if "new_high" in summ else None,
              "nightly_findings_dry_run": summ.get("dry_run"),
          }
          line = json.dumps(row, separators=(",", ":"))
          print("Row:", line)
          open("row.json", "w").write(line + "\n")
          PY

      # Pushes only from main. A branch validation run must not add a row
      # to the history, nor overwrite the summary the morning digest reads.
      # (The gate is the ref, not the dry-run flag: the nightly on main is
      # a dry run until NIGHTLY_FINDINGS_WRITE is set, and its plan must
      # still reach the morning brief.)
      - name: Push row + findings summary to metrics branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cp row.json "$RUNNER_TEMP/row.json"
          if [ -f findings-summary/nightly-findings-summary.json ]; then
            cp findings-summary/nightly-findings-summary.json "$RUNNER_TEMP/findings.json"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git fetch origin metrics
            git switch metrics
          else
            git switch --orphan metrics
            : > .gitkeep
            git add .gitkeep
            git commit -m 'init metrics branch'
          fi

          mkdir -p metrics
          touch metrics/static_analysis.jsonl
          cat "$RUNNER_TEMP/row.json" >> metrics/static_analysis.jsonl
          git add metrics/static_analysis.jsonl
          # The morning digest reads this file: 🔴 for new high findings,
          # 🟡 for the dry-run plan while writes are off. Dry-run summaries
          # are published on purpose (Manager 2026-10-01), so Rick sees
          # exactly what would be filed before turning writes on.
          if [ -f "$RUNNER_TEMP/findings.json" ]; then
            cp "$RUNNER_TEMP/findings.json" metrics/nightly_findings_latest.json
            git add metrics/nightly_findings_latest.json
          fi
          git commit -m "static analysis nightly $TS" || {
            echo "Nothing to commit"
            exit 0
          }
          git push origin metrics

      - name: Top-line summary
        if: always()
        env:
          CONCURRENCY_WARNINGS: ${{ needs.strict-concurrency.outputs.warning_count }}
          MEMORY_SAFETY: ${{ needs.strict-concurrency.outputs.memory_safety_count }}
          MEMORY_SAFETY_SUPPORTED: ${{ needs.strict-concurrency.outputs.memory_safety_supported }}
          CODEQL_FINDINGS: ${{ needs.codeql.outputs.finding_count }}
          CODEQL_EXTRACTED: ${{ needs.codeql.outputs.extracted_files }}
          CODEQL_IN_SCOPE: ${{ needs.codeql.outputs.in_scope_files }}
          SWIFTLINT_STRICT: ${{ needs.lint-strict.outputs.swiftlint_count }}
          PERIPHERY_AGGRESSIVE: ${{ needs.lint-strict.outputs.periphery_count }}
          TYPECHECK_IDENTITIES: ${{ needs.strict-concurrency.outputs.typecheck_identities }}
          TYPECHECK_NEW_SLOW: ${{ needs.strict-concurrency.outputs.typecheck_new_slow }}
          TYPECHECK_SATURATED: ${{ needs.strict-concurrency.outputs.typecheck_saturated }}
          RATCHET_INJECTION_NEW: ${{ needs.source-ratchets.outputs.injection_new }}
          RATCHET_INJECTION_BASE: ${{ needs.source-ratchets.outputs.injection_baseline }}
          RATCHET_CTA_NEW: ${{ needs.source-ratchets.outputs.checkthenact_new }}
          RATCHET_CTA_BASE: ${{ needs.source-ratchets.outputs.checkthenact_baseline }}
          NEW_HIGH: ${{ needs.findings-to-issues.outputs.new_high }}
        run: |
          ASAN=$(python3 -c "import json; print(json.load(open('row.json'))['asan_issues'])" 2>/dev/null || echo '?')
          UBSAN=$(python3 -c "import json; print(json.load(open('row.json'))['ubsan_issues'])" 2>/dev/null || echo '?')
          {
            echo "## Nightly static analysis — $(date -u +'%Y-%m-%d')"
            echo ""
            if [ -n "$NEW_HIGH" ] && [ "$NEW_HIGH" != "0" ]; then
              echo "🔴 **$NEW_HIGH new high-severity finding(s)** — see the Findings → GitHub issues job."
              echo ""
            fi
            echo "| Tool | Findings |"
            echo "|---|---:|"
            echo "| Swift strict concurrency (max) | ${CONCURRENCY_WARNINGS:-?} |"
            echo "| Strict memory safety (SE-0458) | ${MEMORY_SAFETY:-n/a (flag ${MEMORY_SAFETY_SUPPORTED:-?})} |"
            echo "| CodeQL (security-and-quality) | ${CODEQL_FINDINGS:-?} (extracted ${CODEQL_EXTRACTED:-?}/${CODEQL_IN_SCOPE:-?} files) |"
            echo "| Thread Sanitizer | disabled |"
            echo "| Address Sanitizer | $ASAN |"
            echo "| Undefined Behavior Sanitizer | $UBSAN |"
            echo "| SwiftLint --strict | ${SWIFTLINT_STRICT:-?} |"
            echo "| Periphery aggressive | ${PERIPHERY_AGGRESSIVE:-?} |"
            echo ""
            echo "| Ratchet | New (gated) | Grandfathered |"
            echo "|---|---:|---:|"
            echo "| Subprocess injection / concat escaping | ${RATCHET_INJECTION_NEW:-?} | ${RATCHET_INJECTION_BASE:-?} |"
            echo "| Check-then-act on removable volumes | ${RATCHET_CTA_NEW:-?} | ${RATCHET_CTA_BASE:-?} |"
            echo "| New function over the type-check threshold | ${TYPECHECK_NEW_SLOW:-?} | — |"
            echo ""
            echo "Slow-to-type-check identities tracked: **${TYPECHECK_IDENTITIES:-?}** "
            echo "(saturated / \"unable to type-check\": **${TYPECHECK_SATURATED:-?}**). "
            echo "Top 20 worst is in the strict-concurrency job summary and in the "
            echo "\`strict-concurrency-log\` artifact as \`typecheck-top20.txt\`."
            echo ""
            echo "Per-tool details are in the jobs above. CodeQL alerts also live under **Security → Code Scanning**."
            echo "Trend history: \`metrics/static_analysis.jsonl\` on the \`metrics\` branch."
          } >> "$GITHUB_STEP_SUMMARY"
