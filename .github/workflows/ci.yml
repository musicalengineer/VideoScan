name: CI

# Slim build + tests pipeline for every push to main.
#
# 2026-11-04: only the Linux jobs ran (`preflight`; `metrics` since 11/06);
# the two macOS jobs were `if: false` because no hosted image has Xcode 27 /
# Swift 6.4. 2026-11-17 (Rick: "set up the self-hosted runner on the m4"):
# they run on the M4 Studio through a self-hosted runner
# (scripts/install_gh_runner.sh; runs-on [self-hosted, macOS, ARM64, m4]),
# after waiting for the M4's testbed to be idle (scripts/testbed_wait.sh).
# GitHub still runs no test itself (DECISIONS 2026-10-26): it dispatches, the
# M4 runs. Hosted macOS minutes are not used.
#
# Static-analysis tooling (SwiftLint, Periphery, CodeQL, strict concurrency)
# lives in nightly-analysis.yml. PRs no longer run CI because Rick works
# direct-to-main per project policy (feedback_main_branch_ok).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Preflight ───────────────────────────────────────────────────────
  # Pure-python checks: no Xcode, no macOS. Split out of the macOS job so
  # a Swift compile failure can no longer mask a lint or contract-test
  # failure (and vice versa), and so they run on cheap Linux minutes
  # instead of occupying the macOS runner.
  #
  # These still GATE the build rather than running alongside it — the
  # `test` job below declares `needs: preflight`. See the comment there.
  # See project_bug_prevention_strategy memory for the linter framework.
  preflight:
    name: Preflight (lint + contract tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint — @EnvironmentObject usage
        run: |
          python3 scripts/lint_environment_objects.py --selftest
          python3 scripts/lint_environment_objects.py

      # GH #281: the same gate as the pre-commit hook, over the whole tree.
      # Fails on a function over CCN 30 / 300 lines that is new or worse than
      # ci/baselines/complexity_debt.json, or on a new swiftlint:disable of a
      # size/complexity rule, or when the tree's total excess over CCN 15
      # (sum of max(0, CCN - 15)) is above ci/baselines/complexity_ccn15_excess.json.
      # Honors overrides recorded in
      # ci/baselines/complexity_overrides.jsonl, so `--no-verify` does not get
      # past it. lizard pinned to the nightly's version (CCN must not drift).
      - name: Complexity gate (blocking)
        run: |
          python3 -m venv "$RUNNER_TEMP/cx"
          "$RUNNER_TEMP/cx/bin/pip" install --disable-pip-version-check -q 'lizard==1.22.1'
          "$RUNNER_TEMP/cx/bin/python" scripts/complexity_gate.py --all --root .

      # Same check as the pre-commit hook, over the whole tree, so a commit
      # made with --no-verify (or from a clone without the hook) still turns
      # CI red when a test file has no gauntlet stage. 2026-10-06: 103
      # unassigned files blocked every gauntlet stage. Pure Python, < 1 s.
      - name: Gauntlet manifest — every test file has a stage
        run: python3 scripts/gauntlet/manifest_drift.py --all --root .

      - name: Person metrics contract tests
        run: |
          python3 -m unittest \
            tests/test_person_eval_metrics.py \
            tests/test_person_metrics_integration.py \
            tests/test_ci_test_verdict.py

      # The Xcode selector's own regression suite. Runs here rather than on
      # the macOS job because it works entirely on fixtures — it needs no
      # Xcode, and putting it behind a 40-minute Swift build would mean a
      # broken selector is discovered by the build it broke.
      - name: Selftest — Xcode selector
        run: scripts/ci_select_xcode.sh --selftest

  # history.jsonl (the metrics page's App source tile and Code size evidence):
  # one row per push to main. Its own Linux job since 2026-11-06: the step
  # lived in `test` and went dark with it on 11/04 (`if: false`, no Xcode 27);
  # the page read STALE from 11/05. collect_metrics.sh needs no Xcode (the
  # coverage fields are null without an xcresult, as they were on macOS since
  # 2026-09-26) and no other job: a red lint must not stop the size trend.
  # Pinned by tests/test_metrics_dashboard.py.
  metrics:
    name: Metrics row (history.jsonl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No continue-on-error: in its own job a failure blocks nothing else, and
      # it must show red rather than leave the tile to go STALE unnoticed.
      - name: Collect metrics + push to `metrics` branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          chmod +x scripts/collect_metrics.sh
          ROW=$(scripts/collect_metrics.sh)
          echo "Metrics row:"
          echo "$ROW"
          # One valid JSON object or nothing (a malformed 2026-04-22 row is still on the branch).
          python3 -c 'import json, sys; assert isinstance(json.loads(sys.argv[1]), dict)' "$ROW"

          WORK=$(mktemp -d)
          cd "$WORK"

          git clone --branch metrics --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo \
            2>/dev/null || {
              echo "metrics branch does not exist — bootstrapping"
              git clone --depth 1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo
              cd metrics-repo
              git checkout --orphan metrics
              git rm -rf . 2>/dev/null || true
              mkdir -p metrics
              echo "# Metrics history" > README.md
              echo "One JSON row per CI run. Consumed by the dashboard at docs/index.html on main." >> README.md
              touch metrics/history.jsonl
              git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
                commit -m "Bootstrap metrics branch [skip ci]"
              git push -u origin metrics
              cd ..
            }

          cd metrics-repo
          mkdir -p metrics
          echo "$ROW" >> metrics/history.jsonl

          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              add metrics/history.jsonl
          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              commit -m "metrics: ${GITHUB_SHA:0:8} on ${GITHUB_REF_NAME} [skip ci]"

          git push origin metrics || {
              echo "push failed — pulling and retrying once"
              git pull --rebase origin metrics
              git push origin metrics
          }

  # VideoScanCore's own package tests (Rick 2026-09-29: "all tests when
  # possible should be automated"). 83 test files / ~720 tests — fixity,
  # volume identity, GEDCOM merge, tree walk, CyberBrain … — ran in NO
  # automated lane until now: the app scheme does not build the package's
  # test target, the gauntlet blocks package tests, and the nightly never
  # called `swift test`. Separate job so it runs in parallel with the app
  # build instead of adding to its 120-minute budget. Timing budgets in
  # these tests already triple on GitHub (TimingBudget: GITHUB_ACTIONS).
  core:
    name: VideoScanCore package tests
    # OFF 2026-11-04 → 11-17: no hosted macOS image has Xcode 27 / Swift 6.4
    # (the hosted Swift died at VideoScanCore/CatalogReality.swift:324, nightly
    # run 41831293396; the 11/04 pushes got no macOS runner at all, run
    # 41856296282). Since 2026-11-17 it runs on the M4's self-hosted runner,
    # whose Xcode is the fleet's (scripts/update_toolchain.sh). Last hosted
    # green 10/07.
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, m4]
    # One runner, one job at a time: a newer push cancels a queued or running
    # older one — main's newest commit is what matters, and the 14:00 full
    # testbed reads main again anyway.
    concurrency:
      group: m4-runner-core
      cancel-in-progress: true
    # The wait below may sit out a 2 h 10 min full testbed (budget 3 h) before
    # the ~10 min of work; the budget has to hold both.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The M4's Xcode is whatever the fleet runs (CLAUDE.md: Swift 6.4); no
      # selection here — scripts/ci_select_xcode.sh is for hosted images with
      # several Xcode_*.app bundles. Printed so a red run names the toolchain.
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version 2>&1 | head -1
          # FFmpegPreviewRendererE2ETests and friends spawn real ffmpeg/ffprobe
          # (Homebrew on the M4, on the runner's PATH — install_gh_runner.sh).
          ffmpeg -version | head -1

      # The testbed lock (~/m4run/lock) belongs to m4_run.sh and the 14:00
      # nightly; wait until it is free rather than run two builds at once.
      - name: Wait for the M4 testbed to be idle
        run: scripts/testbed_wait.sh --budget 10800

      # `shell: bash` is explicit on purpose: GitHub's implicit default is
      # `bash -e {0}` (NO pipefail), so `… | tee` would return tee's 0 and
      # hide a failing `swift test`. An explicit `shell: bash` runs
      # `bash --noprofile --norc -eo pipefail {0}`. (codex 2026-09-30, P2.)
      - name: swift test
        shell: bash
        run: swift test --package-path VideoScan/VideoScanCore 2>&1 | tee core-tests.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: core-tests.log

  test:
    name: Build & Test
    # OFF 2026-11-04 → 11-17 for the same reason as `core` above (no Xcode 27 /
    # Swift 6.4 on a hosted image). Since 2026-11-17 it runs on the M4's
    # self-hosted runner.
    # Gated on preflight, not parallel with it: the linters were put ahead
    # of the build deliberately, "so a structural mistake doesn't burn
    # 5-10 minutes of compile". The ~30s preflight costs far less than one
    # wasted build on the M4.
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, m4]
    concurrency:
      group: m4-runner-test
      cancel-in-progress: true
    # The wait may sit out a full testbed (budget 3 h); then a Debug build of
    # app + tests (incremental, DerivedData kept between runs) and the
    # VideoScan-CI plan (~9,000 tests, ~20 min on the M5 Pro).
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing in this job pushes (the metrics row moved to its own Linux
          # job 11/06); a self-hosted checkout keeps no token in its config.
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version 2>&1 | head -1
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Show environment
        run: system_profiler SPHardwareDataType | grep "Chip\|Memory"

      # DerivedData OUTSIDE the workspace: actions/checkout cleans the
      # workspace (git clean -ffdx) every run, and a from-scratch Debug build
      # of ~790K lines is the expensive part. One directory per runner, like
      # m4_run.sh's ~/Library/Caches/videoscan-m4run-dd — never that one, never
      # Rick's, never the nightly's: two xcodebuilds in one DerivedData collide.
      - name: DerivedData (kept between runs)
        run: |
          echo "DD=$HOME/Library/Caches/videoscan-ghrunner-dd" >> "$GITHUB_ENV"

      - name: Wait for the M4 testbed to be idle
        run: scripts/testbed_wait.sh --budget 10800

      # Build ONCE — app + test targets. Shared DerivedData for all later steps.
      # Ad-hoc signed, as the M4's testbed builds are (m4_run.sh): on Apple
      # silicon a test host has to carry a signature, and the nightly builds
      # keep their ad-hoc override (DECISIONS 2026-10-28). caffeinate -w $$:
      # the M4 must not sleep while this step's shell lives; a background
      # assertion, not a wrapper, so xcodebuild's own status reaches the pipe.
      - name: Build (app + tests)
        run: |
          set -o pipefail
          caffeinate -i -w $$ &
          xcodebuild build-for-testing \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DD" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild-build.log
          if grep -q "BUILD FAILED" xcodebuild-build.log; then
            echo "::error::Build failed — see log above"
            grep 'error:' xcodebuild-build.log | head -20
            exit 1
          fi

      # ── Unit Tests ──────────────────────────────────────────────────
      # Uses test-without-building to skip the redundant rebuild.
      # GH-hosted virt-M1 runners run ~2s/test (vs 7ms local). At ~400
      # tests that's ~13 min execution. 20 min timeout gives headroom.
      #
      # PROBE 2026-05-19 (iter 2): Previous attempt with
      # -parallel-testing-enabled NO produced 0-suite ghost-pass — the
      # flag is incompatible with Swift Testing on Xcode 16.4 (it forces
      # the legacy XCTest single-process runner, which finds no @Test
      # functions). Switching to .xctestplan approach (NetNewsWire
      # pattern). The plan VideoScan-CI.xctestplan declares
      # parallelizable=false at the test-target level, which controls
      # xcodebuild's multi-process worker pool without breaking Swift
      # Testing's own discovery. Goal: get 60 suites running sequentially.
      # See docs/gh-testing-19-may.md for prior binary-search findings.
      - name: Unit tests — pure-logic suites
        # 2026-09-25: the plan is ~9,000 tests; ricksm5 needs ~20 min, the
        # hosted runner ~2.15x that (~47 min, measured 9/25). 20 min was
        # timing out every push. The M4 Max should sit near the M5 Pro's
        # number; the budget stays until a run measures it.
        timeout-minutes: 75
        run: |
          echo "## Unit Tests — Pure-Logic Suites" >> $GITHUB_STEP_SUMMARY
          START=$(date +%s)
          # ── Hang watchdog (fix/ci-red-4, run 36214064340) ──
          # The test host prints TEST_HOST_HEARTBEAT every 10 s from its main
          # run loop (VideoScan/App/main.swift). No heartbeat for 180 s means the
          # main thread is blocked or spinning: `sample` the host so the log
          # names the stack, then once more 5 min later (identical stack =
          # blocked, moving = spinning). Diagnostic only: never kills, writes
          # to the step log (not test-output.log), cannot change the verdict.
          # sudo -n fallback: an unsigned host may refuse task_for_pid.
          (
            set +e
            # `sleep & wait` so the TERM below lands at once and takes the
            # sleeper with it (no orphan holding the step's stdout open).
            trap 'kill "$NAP" 2>/dev/null; exit 0' TERM
            nap() { sleep "$1" & NAP=$!; wait "$NAP"; }
            n=0
            while [ "$n" -lt 2 ]; do
              nap 30
              last=$(grep -a -o 'TEST_HOST_HEARTBEAT epoch=[0-9]*' test-output.log 2>/dev/null | tail -1 | sed 's/.*epoch=//')
              case "$last" in ''|*[!0-9]*) continue ;; esac
              stale=$(( $(date +%s) - last ))
              [ "$stale" -gt 180 ] || continue
              pid=$(pgrep -f 'Debug/VideoScan.app/Contents/MacOS/VideoScan' | head -1)
              [ -n "$pid" ] || continue
              echo "::warning::HANG WATCHDOG: no TEST_HOST_HEARTBEAT for ${stale}s; sampling test host pid $pid"
              sample "$pid" 10 -file "hang-sample-$n.txt" >/dev/null 2>&1 \
                || sudo -n sample "$pid" 10 -file "hang-sample-$n.txt" >/dev/null 2>&1
              echo "::group::HANG WATCHDOG sample $n (pid $pid, heartbeat stale ${stale}s)"
              cat "hang-sample-$n.txt" 2>/dev/null || echo "(sample failed)"
              echo "::endgroup::"
              n=$((n + 1))
              nap 300
            done
          ) &
          HANG_WATCHDOG_PID=$!
          # Coverage is OFF, deliberately (2026-09-26, run 36202513830).
          # It was never real: "Build (app + tests)" runs build-for-testing
          # WITHOUT -enableCodeCoverage, so the binary has no profile
          # counters, and -enableCodeCoverage YES here only made xcodebuild
          # set LLVM_PROFILE_FILE to a real path. xccov reported "(no
          # coverage data)" on every run, and PerformanceLaneTests' sensor
          # ("env rule agrees with the live binary's instrumentation") went
          # red on the contradiction. Real coverage needs the flag on BOTH
          # steps and an instrumented (slower) Debug run — Rick's call.
          # TEST_RUNNER_ prefix: xcodebuild strips it and injects the var
          # into the test host process. CICanaryTests.mustFail is gated on
          # GITHUB_ACTIONS (CI-only since 2026-06-09 — it polluted local
          # full-suite totals); without this the host never sees the var
          # and the canary check below would hard-fail as GHOST-PASS.
          #
          # EXIT CODE (fix/ci-red-5, run 36223041786): this step's shell is
          # `bash -e` WITHOUT pipefail, so `xcodebuild … | tee … || X=$?`
          # recorded TEE's status — always 0 — and the verdict reported
          # "Unexpected xcodebuild exit 0" on the first run ever to reach it.
          # PIPESTATUS[0] is xcodebuild's own status. `set +e` around the
          # pipeline keeps -e (or a future pipefail) from aborting the step
          # before the status is read.
          set +e
          caffeinate -i -w $$ &
          TEST_RUNNER_GITHUB_ACTIONS=true \
          xcodebuild test-without-building \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -testPlan VideoScan-CI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DD" \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee test-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "xcodebuild exit status: $TEST_EXIT"
          kill "$HANG_WATCHDOG_PID" 2>/dev/null || true
          END=$(date +%s)
          ELAPSED=$((END - START))
          # Swift Testing emits ✔/✘/◇ markers; legacy XCTest emits "Test Case ..."
          # Count both so the canary is robust to either runner being used.
          PASSED=$(grep -cE '^(✔ Test |Test Case .*passed)' test-output.log || true)
          FAILED=$(grep -E '^(✘ Test .*failed after|Test Case .*failed)' test-output.log | grep -cv '^✘ Test run with ' || true)
          SUITES_STARTED=$(grep -cE '^(◇ Suite |Test Suite .*started)' test-output.log || true)

          # ── Canary verification ──
          # CICanaryTests/mustFail MUST appear as failed.
          # CICanaryTests/mustPass MUST appear as passed.
          # If either is missing or wrong, tests are ghost-passing.
          CANARY_FAIL=$(grep -cE '^✘ Test mustFail\(\).*failed after' test-output.log || true)
          CANARY_PASS=$(grep -cE '^✔ Test mustPass\(\).*passed after' test-output.log || true)
          GHOST=0
          if [ "$CANARY_FAIL" -eq 0 ]; then
            echo "::error::GHOST-PASS DETECTED: CICanaryTests/mustFail did not appear as failed"
            GHOST=1
          fi
          if [ "$CANARY_PASS" -eq 0 ]; then
            echo "::error::GHOST-PASS DETECTED: CICanaryTests/mustPass did not appear as passed"
            GHOST=1
          fi
          if [ "$SUITES_STARTED" -lt 20 ]; then
            echo "::error::GHOST-PASS DETECTED: only $SUITES_STARTED suites started (expected 20+)"
            GHOST=1
          fi

          # Subtract the expected canary failure from counts
          REAL_FAILED=$((FAILED - CANARY_FAIL))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Wall time | ${ELAPSED}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Real failures | $REAL_FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary fail detected | $CANARY_FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary pass detected | $CANARY_PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Suites started | $SUITES_STARTED |" >> $GITHUB_STEP_SUMMARY
          if [ "$PASSED" -gt 0 ]; then
            RATE=$(echo "scale=2; $ELAPSED / ($PASSED + $FAILED)" | bc 2>/dev/null || echo "?")
            echo "| Avg sec/test | ${RATE} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$GHOST" -ne 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### GHOST-PASS FAILURE" >> $GITHUB_STEP_SUMMARY
            echo "Tests are not executing properly. See errors above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "$REAL_FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Real Failures (excluding canary)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '^(✘ Test .*failed after|Test Case .*failed)' test-output.log \
              | grep -v 'mustFail()\|Test run with' >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::$REAL_FAILED real test failure(s)"
            exit 1
          fi

          # Canaries alone do not prove completion. Reject interrupted runs,
          # unexpected exit codes, and failures missed by the display counters.
          python3 scripts/ci_test_verdict.py test-output.log --exit-code "$TEST_EXIT"

      # ── Reporting ───────────────────────────────────────────────────

      - name: Test Summary (pass/fail with details)
        if: always()
        run: |
          chmod +x scripts/ci_test_summary.sh
          scripts/ci_test_summary.sh TestResults.xcresult

      # (Coverage Summary step removed 2026-09-26: coverage was never
      # collected — see the comment on the unit-test step.)

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
