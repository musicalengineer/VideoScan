name: CI

# Slim build + tests pipeline for every push to main.
#
# Static-analysis tooling (SwiftLint, Periphery, CodeQL, strict concurrency)
# lives in nightly-analysis.yml. PRs no longer run CI because Rick works
# direct-to-main per project policy (feedback_main_branch_ok).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Preflight ───────────────────────────────────────────────────────
  # Pure-python checks: no Xcode, no macOS. Split out of the macOS job so
  # a Swift compile failure can no longer mask a lint or contract-test
  # failure (and vice versa), and so they run on cheap Linux minutes
  # instead of occupying the macOS runner.
  #
  # These still GATE the build rather than running alongside it — the
  # `test` job below declares `needs: preflight`. See the comment there.
  # See project_bug_prevention_strategy memory for the linter framework.
  preflight:
    name: Preflight (lint + contract tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint — @EnvironmentObject usage
        run: |
          python3 scripts/lint_environment_objects.py --selftest
          python3 scripts/lint_environment_objects.py

      - name: Person metrics contract tests
        run: |
          python3 -m unittest \
            tests/test_person_eval_metrics.py \
            tests/test_person_metrics_integration.py

      # The Xcode selector's own regression suite. Runs here rather than on
      # the macOS job because it works entirely on fixtures — it needs no
      # Xcode, and putting it behind a 40-minute Swift build would mean a
      # broken selector is discovered by the build it broke.
      - name: Selftest — Xcode selector
        run: scripts/ci_select_xcode.sh --selftest

  test:
    name: Build & Test
    # Gated on preflight, not parallel with it: the linters were put ahead
    # of the build deliberately, "so a structural mistake doesn't burn
    # 5-10 minutes of compile", and macOS minutes bill at 10x Linux. The
    # ~30s preflight costs far less than one wasted macOS build.
    needs: preflight
    runs-on: macos-15
    # 60, not 30. Xcode 26.x carries a documented compile-time regression
    # on hosted runners (actions/runner-images#13096). The build has no
    # choice but to use 26.x — see Select Xcode — so the budget has to
    # absorb it. Revisit once a real run gives us the actual number.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Xcode 26.x is REQUIRED, not preferred. Full history is in the
      # header of scripts/ci_select_xcode.sh; short version: the app uses
      # Swift 6.2 isolated conformances, Xcode 16.4's Swift 6.1 cannot
      # parse them, and the old hard-coded 16.4 pin is why every CI run
      # from mid-June to 2026-08-30 failed in SwiftCompile without
      # reaching a test. The script resolves the newest installed 26.x and
      # hard-fails if the selected compiler is older than Swift 6.2.
      - name: Select Xcode (26.x required)
        run: scripts/ci_select_xcode.sh

      - name: Show environment
        run: system_profiler SPHardwareDataType | grep "Chip\|Memory"

      - name: Install FFmpeg
        run: |
          brew install ffmpeg || true
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Build ONCE — app + test targets. Shared DerivedData for all later steps.
      - name: Build (app + tests)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild-build.log
          if grep -q "BUILD FAILED" xcodebuild-build.log; then
            echo "::error::Build failed — see log above"
            grep 'error:' xcodebuild-build.log | head -20
            exit 1
          fi

      # ── Unit Tests ──────────────────────────────────────────────────
      # Uses test-without-building to skip the redundant rebuild.
      # GH-hosted virt-M1 runners run ~2s/test (vs 7ms local). At ~400
      # tests that's ~13 min execution. 20 min timeout gives headroom.
      #
      # PROBE 2026-05-19 (iter 2): Previous attempt with
      # -parallel-testing-enabled NO produced 0-suite ghost-pass — the
      # flag is incompatible with Swift Testing on Xcode 16.4 (it forces
      # the legacy XCTest single-process runner, which finds no @Test
      # functions). Switching to .xctestplan approach (NetNewsWire
      # pattern). The plan VideoScan-CI.xctestplan declares
      # parallelizable=false at the test-target level, which controls
      # xcodebuild's multi-process worker pool without breaking Swift
      # Testing's own discovery. Goal: get 60 suites running sequentially.
      # See docs/gh-testing-19-may.md for prior binary-search findings.
      - name: Unit tests — pure-logic suites
        timeout-minutes: 20
        run: |
          echo "## Unit Tests — Pure-Logic Suites" >> $GITHUB_STEP_SUMMARY
          START=$(date +%s)
          # TEST_RUNNER_ prefix: xcodebuild strips it and injects the var
          # into the test host process. CICanaryTests.mustFail is gated on
          # GITHUB_ACTIONS (CI-only since 2026-06-09 — it polluted local
          # full-suite totals); without this the host never sees the var
          # and the canary check below would hard-fail as GHOST-PASS.
          TEST_RUNNER_GITHUB_ACTIONS=true \
          xcodebuild test-without-building \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -testPlan VideoScan-CI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee test-output.log || TEST_EXIT=$?
          END=$(date +%s)
          ELAPSED=$((END - START))
          # Swift Testing emits ✔/✘/◇ markers; legacy XCTest emits "Test Case ..."
          # Count both so the canary is robust to either runner being used.
          PASSED=$(grep -cE '^(✔ Test |Test Case .*passed)' test-output.log || true)
          FAILED=$(grep -cE '^(✘ Test .*failed after|Test Case .*failed)' test-output.log | grep -cv 'Test run with' || true)
          SUITES_STARTED=$(grep -cE '^(◇ Suite |Test Suite .*started)' test-output.log || true)

          # ── Canary verification ──
          # CICanaryTests/mustFail MUST appear as failed.
          # CICanaryTests/mustPass MUST appear as passed.
          # If either is missing or wrong, tests are ghost-passing.
          CANARY_FAIL=$(grep -cE '^✘ Test mustFail\(\).*failed after' test-output.log || true)
          CANARY_PASS=$(grep -cE '^✔ Test mustPass\(\).*passed after' test-output.log || true)
          GHOST=0
          if [ "$CANARY_FAIL" -eq 0 ]; then
            echo "::error::GHOST-PASS DETECTED: CICanaryTests/mustFail did not appear as failed"
            GHOST=1
          fi
          if [ "$CANARY_PASS" -eq 0 ]; then
            echo "::error::GHOST-PASS DETECTED: CICanaryTests/mustPass did not appear as passed"
            GHOST=1
          fi
          if [ "$SUITES_STARTED" -lt 20 ]; then
            echo "::error::GHOST-PASS DETECTED: only $SUITES_STARTED suites started (expected 20+)"
            GHOST=1
          fi

          # Subtract the expected canary failure from counts
          REAL_FAILED=$((FAILED - CANARY_FAIL))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Wall time | ${ELAPSED}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Real failures | $REAL_FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary fail detected | $CANARY_FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary pass detected | $CANARY_PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Suites started | $SUITES_STARTED |" >> $GITHUB_STEP_SUMMARY
          if [ "$PASSED" -gt 0 ]; then
            RATE=$(echo "scale=2; $ELAPSED / ($PASSED + $FAILED)" | bc 2>/dev/null || echo "?")
            echo "| Avg sec/test | ${RATE} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$GHOST" -ne 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### GHOST-PASS FAILURE" >> $GITHUB_STEP_SUMMARY
            echo "Tests are not executing properly. See errors above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "$REAL_FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Real Failures (excluding canary)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '^(✘ Test .*failed after|Test Case .*failed)' test-output.log \
              | grep -v 'mustFail()\|Test run with' >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::$REAL_FAILED real test failure(s)"
            exit 1
          fi

      # ── Reporting ───────────────────────────────────────────────────

      - name: Test Summary (pass/fail with details)
        if: always()
        run: |
          chmod +x scripts/ci_test_summary.sh
          scripts/ci_test_summary.sh TestResults.xcresult

      - name: Coverage Summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo "## Coverage by File" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            xcrun xccov view --report --files-for-target VideoScan.app TestResults.xcresult \
              | awk -F'  +' 'NR>2 && $3 != "" {printf "%-50s %s\n", $2, $3}' \
              >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(coverage data unavailable)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "## Overall"
            xcrun xccov view --report --only-targets TestResults.xcresult 2>/dev/null || echo "(no coverage data)"
          else
            echo "No TestResults.xcresult found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14

      # ── Metrics ─────────────────────────────────────────────────────

      - name: Collect metrics + push to `metrics` branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          chmod +x scripts/collect_metrics.sh
          ROW=$(scripts/collect_metrics.sh)
          echo "Metrics row:"
          echo "$ROW"

          WORK=$(mktemp -d)
          cd "$WORK"

          git clone --branch metrics --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo \
            2>/dev/null || {
              echo "metrics branch does not exist — bootstrapping"
              git clone --depth 1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo
              cd metrics-repo
              git checkout --orphan metrics
              git rm -rf . 2>/dev/null || true
              mkdir -p metrics
              echo "# Metrics history" > README.md
              echo "One JSON row per CI run. Consumed by the dashboard at docs/index.html on main." >> README.md
              touch metrics/history.jsonl
              git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
                commit -m "Bootstrap metrics branch [skip ci]"
              git push -u origin metrics
              cd ..
            }

          cd metrics-repo
          mkdir -p metrics
          echo "$ROW" >> metrics/history.jsonl

          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              add metrics/history.jsonl
          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              commit -m "metrics: ${GITHUB_SHA:0:8} on ${GITHUB_REF_NAME} [skip ci]"

          git push origin metrics || {
              echo "push failed — pulling and retrying once"
              git pull --rebase origin metrics
              git push origin metrics
          }
