name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          system_profiler SPHardwareDataType | grep "Chip\|Memory"

      - name: Install SwiftLint, Periphery & FFmpeg
        run: |
          brew install swiftlint || true
          brew install peripheryapp/periphery/periphery || true
          brew upgrade peripheryapp/periphery/periphery || true
          brew install ffmpeg || true
          echo "Periphery: $(periphery version)"
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: SwiftLint (warn-only for now)
        run: |
          echo "## SwiftLint Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter emoji 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter xcode > swiftlint-raw.txt 2>&1 || true
          echo "SWIFTLINT_OUTPUT=$(pwd)/swiftlint-raw.txt" >> $GITHUB_ENV

      # Build ONCE — app + test targets. Shared DerivedData for all later steps.
      - name: Build (app + tests)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild-build.log
          if grep -q "BUILD FAILED" xcodebuild-build.log; then
            echo "::error::Build failed — see log above"
            grep 'error:' xcodebuild-build.log | head -20
            exit 1
          fi

      - name: Periphery — unused code report (non-blocking)
        continue-on-error: true
        run: |
          echo "## Periphery — unused code" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          periphery scan --exclude-tests 2>&1 | tee periphery-raw.txt | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "PERIPHERY_OUTPUT=$(pwd)/periphery-raw.txt" >> $GITHUB_ENV

      # ── Unit Tests ──────────────────────────────────────────────────
      # Uses test-without-building to skip the redundant rebuild.
      # GH-hosted virt-M1 runners run ~2s/test (vs 7ms local). At ~400
      # tests that's ~13 min execution. 20 min timeout gives headroom.
      #
      # 50 suites / 566 tests — proven ceiling on GH virt-M1 runner.
      # 55+ hangs the parallel test runner between dispatch batches.
      # Binary search 2026-05-19: 1,20,40,50=pass; 55,60,75=hang.
      - name: Unit tests — pure-logic suites
        timeout-minutes: 20
        run: |
          echo "## Unit Tests — Pure-Logic Suites" >> $GITHUB_STEP_SUMMARY
          START=$(date +%s)
          xcodebuild test-without-building \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -only-testing:VideoScanTests/FilenameCorrelationKeyTests \
            -only-testing:VideoScanTests/CorrelatorTests \
            -only-testing:VideoScanTests/AvidClipIDTests \
            -only-testing:VideoScanTests/ScoreCorrelatePairTests \
            -only-testing:VideoScanTests/BuildAudioPoolsTests \
            -only-testing:VideoScanTests/ResolveScopeTests \
            -only-testing:VideoScanTests/AssignCandidatesTests \
            -only-testing:VideoScanTests/FormattingDelegateTests \
            -only-testing:VideoScanTests/FormattingTests \
            -only-testing:VideoScanTests/FormattingBoundaryTests \
            -only-testing:VideoScanTests/FormattingExtendedTests \
            -only-testing:VideoScanTests/FileHasherTests \
            -only-testing:VideoScanTests/StreamTypeTests \
            -only-testing:VideoScanTests/StreamTypeBoundaryTests \
            -only-testing:VideoScanTests/VideoRecordTests \
            -only-testing:VideoScanTests/VideoRecordBoundaryTests \
            -only-testing:VideoScanTests/PairConfidenceTests \
            -only-testing:VideoScanTests/DuplicateConfidenceTests \
            -only-testing:VideoScanTests/ScanPhaseTests \
            -only-testing:VideoScanTests/DiscoveredVolumeTests \
            -only-testing:VideoScanTests/DashboardBoundaryTests \
            -only-testing:VideoScanTests/DashboardCombineCounterTests \
            -only-testing:VideoScanTests/VolumeRootTests \
            -only-testing:VideoScanTests/VideoRecordSnapshotTests \
            -only-testing:VideoScanTests/CatalogTargetStatusTests \
            -only-testing:VideoScanTests/CatalogScanTargetStatusExtendedTests \
            -only-testing:VideoScanTests/ScanPerformanceSettingsTests \
            -only-testing:VideoScanTests/CombinePairItemTests \
            -only-testing:VideoScanTests/CombineJobStatusTests \
            -only-testing:VideoScanTests/CombineJobStatusBoundaryTests \
            -only-testing:VideoScanTests/RecognitionEngineTests \
            -only-testing:VideoScanTests/LifecycleStageTests \
            -only-testing:VideoScanTests/DetectedPeopleTests \
            -only-testing:VideoScanTests/ArchiveHealthTests \
            -only-testing:VideoScanTests/UniversalSearchTokenTests \
            -only-testing:VideoScanTests/UniversalSearchYearExtractionTests \
            -only-testing:VideoScanTests/UniversalSearchMatchingTests \
            -only-testing:VideoScanTests/TriageDispositionTests \
            -only-testing:VideoScanTests/TriageQueueTests \
            -only-testing:VideoScanTests/DispositionTests \
            -only-testing:VideoScanTests/DispositionThresholdTests \
            -only-testing:VideoScanTests/TransitionRuleTests \
            -only-testing:VideoScanTests/TestTempRuleTests \
            -only-testing:VideoScanTests/CatalogPurgeTests \
            -only-testing:VideoScanTests/CatalogPurgeUndoStateTests \
            -only-testing:VideoScanTests/CatalogPurgeGapTests \
            -only-testing:VideoScanTests/CatalogSkipSetTests \
            -only-testing:VideoScanTests/CatalogFilterBoundaryTests \
            -only-testing:VideoScanTests/CatalogNavigationTests \
            -only-testing:VideoScanTests/CatalogImportExportTests \
            -only-testing:VideoScanTests/ScanContextTests \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee test-output.log || TEST_EXIT=$?
          END=$(date +%s)
          ELAPSED=$((END - START))
          PASSED=$(grep -c "Test case.*passed" test-output.log || true)
          FAILED=$(grep -c "Test case.*failed" test-output.log || true)
          # Per-test latency (first 5 + last 5 for sampling)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Wall time | ${ELAPSED}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          if [ "$PASSED" -gt 0 ]; then
            RATE=$(echo "scale=2; $ELAPSED / ($PASSED + $FAILED)" | bc 2>/dev/null || echo "?")
            echo "| Avg sec/test | ${RATE} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Exit code | ${TEST_EXIT:-0} |" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep "Test case.*failed" test-output.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${TEST_EXIT:-0}" -ne 0 ]; then
            echo "::error::Unit tests exited ${TEST_EXIT}"
            exit 1
          fi

      # ── Reporting ───────────────────────────────────────────────────

      - name: Test Summary (pass/fail with details)
        if: always()
        run: |
          chmod +x scripts/ci_test_summary.sh
          scripts/ci_test_summary.sh TestResults.xcresult

      - name: Coverage Summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo "## Coverage by File" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            xcrun xccov view --report --files-for-target VideoScan.app TestResults.xcresult \
              | awk -F'  +' 'NR>2 && $3 != "" {printf "%-50s %s\n", $2, $3}' \
              >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(coverage data unavailable)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "## Overall"
            xcrun xccov view --report --only-targets TestResults.xcresult 2>/dev/null || echo "(no coverage data)"
          else
            echo "No TestResults.xcresult found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14

      # ── Metrics ─────────────────────────────────────────────────────

      - name: Collect metrics + push to `metrics` branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          chmod +x scripts/collect_metrics.sh
          ROW=$(scripts/collect_metrics.sh)
          echo "Metrics row:"
          echo "$ROW"

          WORK=$(mktemp -d)
          cd "$WORK"

          git clone --branch metrics --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo \
            2>/dev/null || {
              echo "metrics branch does not exist — bootstrapping"
              git clone --depth 1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo
              cd metrics-repo
              git checkout --orphan metrics
              git rm -rf . 2>/dev/null || true
              mkdir -p metrics
              echo "# Metrics history" > README.md
              echo "One JSON row per CI run. Consumed by the dashboard at docs/index.html on main." >> README.md
              touch metrics/history.jsonl
              git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
                commit -m "Bootstrap metrics branch [skip ci]"
              git push -u origin metrics
              cd ..
            }

          cd metrics-repo
          mkdir -p metrics
          echo "$ROW" >> metrics/history.jsonl

          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              add metrics/history.jsonl
          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              commit -m "metrics: ${GITHUB_SHA:0:8} on ${GITHUB_REF_NAME} [skip ci]"

          git push origin metrics || {
              echo "push failed — pulling and retrying once"
              git pull --rebase origin metrics
              git push origin metrics
          }
