name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    # Tests run at ~2s each on virtual-M1 CI (vs ~7ms on local Mac Studio)
    # due to a known Xcode 26.x bug on GH-hosted runners — see
    # actions/runner-images#13096 (open, unfixed). Suite needs ~43 min per
    # config (Debug + Release) at observed pace. 90 min gives headroom for
    # the surrounding steps. Band-aid until root cause diagnosed via local
    # repro on the MBP test runner.
    timeout-minutes: 30
    # Allow this job to push to the `metrics` branch (history.jsonl for the
    # trend dashboard). Scoped to contents only — no packages/actions/etc.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history? No — shallow is fine. But we DO need the token
          # persisted in git config so the later push step can auth.
          persist-credentials: true

      - name: Select Xcode
        # Pinned to 16.4 deliberately, NOT bleeding-edge 26.x. Xcode 26.x has a
        # known severe slowdown (~2s/test) for Swift Testing on virtualized M1
        # GitHub-hosted runners — see actions/runner-images#13096. MeetingBar
        # (the only macOS SwiftUI app we found running unit tests on GH-hosted
        # CI cleanly) pins Xcode 16.2 for the same reason: 55ms/test instead
        # of 2s/test on the SAME macos-15-arm64 image.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          system_profiler SPHardwareDataType | grep "Chip\|Memory"

      - name: Install SwiftLint, Periphery & FFmpeg
        run: |
          # Force latest Periphery — runner image caches an older version
          # (was 2.21.2; tap installs are 3.x+). 3.x has new findings
          # categories that 2.x silently misses.
          brew install swiftlint || true
          # Force latest Periphery — runner image preinstalls 2.21.2,
          # which predates the --exclude-tests CLI flag we use below.
          # `brew install` no-ops on pre-installed packages so the old
          # `install || upgrade` chain never bumped the version.
          brew install peripheryapp/periphery/periphery || true
          brew upgrade peripheryapp/periphery/periphery || true
          brew install ffmpeg || true
          echo "Periphery: $(periphery version)"
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: SwiftLint (warn-only for now)
        # Non-blocking so we can ratchet down violations gradually.
        # To make this blocking, replace `|| true` with `--strict`.
        # Also captures raw Xcode-format output to a file so the metrics
        # collector can count warnings/errors.
        run: |
          echo "## SwiftLint Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          swiftlint lint --reporter emoji 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Raw output for metrics (Xcode reporter = one finding per line with ": warning:" / ": error:")
          swiftlint lint --reporter xcode > swiftlint-raw.txt 2>&1 || true
          echo "SWIFTLINT_OUTPUT=$(pwd)/swiftlint-raw.txt" >> $GITHUB_ENV

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild-build.log
          if grep -q "BUILD FAILED" xcodebuild-build.log; then
            echo "::error::Build failed — see log above"
            grep 'error:' xcodebuild-build.log | head -20
            exit 1
          fi

      - name: Periphery — unused code report (non-blocking)
        # Periphery builds its own index internally, so no --skip-build.
        # Configuration lives in .periphery.yml.
        continue-on-error: true
        run: |
          echo "## Periphery — unused code" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # --exclude-tests: test helpers are allowed to look "unused";
          # the nightly job runs without this flag for the aggressive view.
          periphery scan --exclude-tests 2>&1 | tee periphery-raw.txt | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "PERIPHERY_OUTPUT=$(pwd)/periphery-raw.txt" >> $GITHUB_ENV

      - name: Unit tests — pure-logic suites (binary search step 1)
        # 2026-05-19: ~400 tests across pure-logic suites. No ffmpeg, no media
        # fixtures, no framework setup. If these pass, the runner is solid and
        # failures live in the heavier suites.
        timeout-minutes: 15
        run: |
          echo "## Unit Tests — Pure-Logic Suites" >> $GITHUB_STEP_SUMMARY
          START=$(date +%s)
          xcodebuild test \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:VideoScanTests/FilenameCorrelationKeyTests \
            -only-testing:VideoScanTests/CorrelatorTests \
            -only-testing:VideoScanTests/AvidClipIDTests \
            -only-testing:VideoScanTests/ScoreCorrelatePairTests \
            -only-testing:VideoScanTests/BuildAudioPoolsTests \
            -only-testing:VideoScanTests/ResolveScopeTests \
            -only-testing:VideoScanTests/AssignCandidatesTests \
            -only-testing:VideoScanTests/FormattingDelegateTests \
            -only-testing:VideoScanTests/FormattingTests \
            -only-testing:VideoScanTests/FormattingBoundaryTests \
            -only-testing:VideoScanTests/FormattingExtendedTests \
            -only-testing:VideoScanTests/FileHasherTests \
            -only-testing:VideoScanTests/DashboardBoundaryTests \
            -only-testing:VideoScanTests/DashboardCombineCounterTests \
            -only-testing:VideoScanTests/VolumeRootTests \
            -only-testing:VideoScanTests/StreamTypeTests \
            -only-testing:VideoScanTests/StreamTypeBoundaryTests \
            -only-testing:VideoScanTests/VideoRecordTests \
            -only-testing:VideoScanTests/VideoRecordBoundaryTests \
            -only-testing:VideoScanTests/VideoRecordSnapshotTests \
            -only-testing:VideoScanTests/PairConfidenceTests \
            -only-testing:VideoScanTests/DuplicateConfidenceTests \
            -only-testing:VideoScanTests/CatalogTargetStatusTests \
            -only-testing:VideoScanTests/CatalogScanTargetStatusExtendedTests \
            -only-testing:VideoScanTests/ScanPhaseTests \
            -only-testing:VideoScanTests/ScanPerformanceSettingsTests \
            -only-testing:VideoScanTests/DiscoveredVolumeTests \
            -only-testing:VideoScanTests/CombinePairItemTests \
            -only-testing:VideoScanTests/CombineJobStatusTests \
            -only-testing:VideoScanTests/CombineJobStatusBoundaryTests \
            -only-testing:VideoScanTests/RecognitionEngineTests \
            -only-testing:VideoScanTests/LifecycleStageTests \
            -only-testing:VideoScanTests/DetectedPeopleTests \
            -only-testing:VideoScanTests/ArchiveHealthTests \
            -only-testing:VideoScanTests/UniversalSearchTokenTests \
            -only-testing:VideoScanTests/UniversalSearchYearExtractionTests \
            -only-testing:VideoScanTests/UniversalSearchMatchingTests \
            -only-testing:VideoScanTests/TriageDispositionTests \
            -only-testing:VideoScanTests/TriageQueueTests \
            -only-testing:VideoScanTests/DispositionTests \
            -only-testing:VideoScanTests/DispositionThresholdTests \
            -only-testing:VideoScanTests/TransitionRuleTests \
            -only-testing:VideoScanTests/TestTempRuleTests \
            -only-testing:VideoScanTests/CatalogPurgeTests \
            -only-testing:VideoScanTests/CatalogPurgeUndoStateTests \
            -only-testing:VideoScanTests/CatalogPurgeGapTests \
            -only-testing:VideoScanTests/CatalogSkipSetTests \
            -only-testing:VideoScanTests/CatalogFilterBoundaryTests \
            -only-testing:VideoScanTests/CatalogNavigationTests \
            -only-testing:VideoScanTests/CatalogImportExportTests \
            -only-testing:VideoScanTests/ScanContextTests \
            -only-testing:VideoScanTests/PersonScanPrefilterTests \
            -only-testing:VideoScanTests/PersonFinderEngineDispatchTests \
            -only-testing:VideoScanTests/POIStorageTests \
            -only-testing:VideoScanTests/POIDeletionTests \
            -only-testing:VideoScanTests/POIUndoDeleteTests \
            -only-testing:VideoScanTests/AsyncSemaphoreTests \
            -only-testing:VideoScanTests/PauseGateTests \
            -only-testing:VideoScanTests/MxfBinaryHelperTests \
            -only-testing:VideoScanTests/MxfCodecIdentificationTests \
            -only-testing:VideoScanTests/MxfPixelLayoutTests \
            -only-testing:VideoScanTests/MxfMetadataTests \
            -only-testing:VideoScanTests/AvbParserTests \
            -only-testing:VideoScanTests/AvbParserBoundaryTests \
            -only-testing:VideoScanTests/AvbDataModelTests \
            -only-testing:VideoScanTests/BundleImportLegacyManifestTests \
            -only-testing:VideoScanTests/BundleExportProfileValidatorTests \
            -only-testing:VideoScanTests/ExternalMediaManifestDecodingTests \
            -only-testing:VideoScanTests/DuplicateDetectorBoundaryTests \
            -only-testing:VideoScanTests/CombineEngineBoundaryTests \
            -only-testing:VideoScanTests/VolumeReachabilityBoundaryTests \
            -only-testing:VideoScanTests/OnlineSubstituteTests \
            -only-testing:VideoScanTests/OnlineSubstituteBoundaryTests \
            -only-testing:VideoScanTests/CodecCompatibilityTests \
            -only-testing:VideoScanTests/CodecCompatibilityBoundaryTests \
            -only-testing:VideoScanTests/DiskFeederTests \
            -only-testing:VideoScanTests/MemoryPressureFunctionTests \
            -only-testing:VideoScanTests/PersonFinderCacheTests \
            -only-testing:VideoScanTests/CopyMetadataCrashTests \
            -enableCodeCoverage NO \
            -resultBundlePath PureLogicTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee pure-logic-tests.log || TEST_EXIT=$?
          END=$(date +%s)
          ELAPSED=$((END - START))
          PASSED=$(grep -c "Test case.*passed" pure-logic-tests.log || true)
          FAILED=$(grep -c "Test case.*failed" pure-logic-tests.log || true)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Wall time | ${ELAPSED}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit code | ${TEST_EXIT:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep "Test case.*failed" pure-logic-tests.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${TEST_EXIT:-0}" -ne 0 ]; then
            echo "::error::Pure-logic tests exited ${TEST_EXIT}"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # TEST EXECUTION DISABLED on GH-hosted runners (2026-05-11)
      #
      # Reason: Xcode 26.x + virtualized macos-15 runners exhibit a ~285x
      # slowdown per test (~2s each vs ~7ms local), causing every run to
      # hit the workflow timeout. See actions/runner-images#13096 (open,
      # unfixed) and docs/development_practices.md § CI & Test Infrastructure.
      #
      # Tests now run on local Mac Studio + MBP (manually until M5 arrives
      # 2026-05-14 and we set up a self-hosted runner on the M1 Max).
      #
      # To re-enable: flip `if: false` → `if: true` on the three steps below
      # AND switch `runs-on: macos-15` to `runs-on: [self-hosted, macOS]`.
      # ─────────────────────────────────────────────────────────────────

      - name: Schedule diagnostic sample capture
        if: false
        run: |
          # Forensic stack trace from the running test host. Fires 5 min into
          # the test step; samples for 30s; uploads regardless of pass/fail.
          # Helps pinpoint where each test is parked during the ~2s/test
          # slowness on virtual-M1 runners (see actions/runner-images#13096).
          (
            sleep 300
            PID=$(pgrep -fx 'xctest' | head -1 || pgrep -f VideoScan.app/Contents/MacOS/VideoScan | head -1)
            if [ -n "$PID" ]; then
              echo "Capturing sample of PID $PID..."
              sample "$PID" 30 -file /tmp/xctest-sample.txt 2>&1 || echo "(sample failed)"
              echo "::group::Sample summary"
              head -50 /tmp/xctest-sample.txt 2>/dev/null || echo "(no sample file)"
              echo "::endgroup::"
            else
              echo "No xctest process found at 5-min mark"
              ps auxww | head -30 > /tmp/xctest-sample.txt
            fi
          ) &
          echo "Sample scheduler started (PID $!)"

      - name: Run Unit Tests (Debug)  # DISABLED — virt-M1 ghost-skip
        # Was a 1-test scaling probe; xcodebuild exits 0 with 0/0 tests on
        # the virtualized M1 runner (Swift Testing discovery fails silently),
        # which trips the count-tripwire and fails every push. Real test
        # authority lives in TestDriver on Rick's Mac hardware (see
        # memory/feedback_GH_CI_Dead_for_unit_tests). Re-enable only when a
        # self-hosted MBP runner is wired up.
        if: false
        run: |
          set -o pipefail
          echo "EXPERIMENT: running 1 test to measure GH-runner per-test latency"
          time xcodebuild test \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:VideoScanTests/PersonFinderEngineDispatchTests/dlibBailsWhenPythonPathEmpty \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild-test.log || XCODEBUILD_EXIT=$?
          # Check xcresult for the authoritative pass/fail count.
          # IMPORTANT: an empty SUMMARY (e.g. when xcresult is malformed or
          # missing) used to silently default to 0/0 and skip the failure
          # check entirely — that's how 570 failures were reported as
          # "success" pre-May-10. Now we treat empty/zero-total as a
          # failure tripwire.
          SUMMARY=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact 2>/dev/null) || true
          FAILED=$(echo "$SUMMARY" | jq -r '.failedTests // 0')
          PASSED=$(echo "$SUMMARY" | jq -r '.passedTests // 0')
          TOTAL=$((PASSED + FAILED))
          echo "Debug tests: $PASSED passed, $FAILED failed (xcodebuild exit ${XCODEBUILD_EXIT:-0})"
          if [ "${XCODEBUILD_EXIT:-0}" -ne 0 ]; then
            echo "::error::xcodebuild test exited non-zero: ${XCODEBUILD_EXIT}"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Debug tests failed: $FAILED of $TOTAL"
            exit 1
          fi
          if [ "$TOTAL" -lt 1 ]; then
            echo "::error::Test count $TOTAL — experiment expected at least 1."
            exit 1
          fi

      - name: Run Unit Tests (Release — optimizer smoke test)
        if: false   # disabled — see comment above the diagnostic sample step
        run: |
          set -o pipefail
          xcodebuild test \
            -project VideoScan/VideoScan.xcodeproj \
            -scheme VideoScan \
            -configuration Release \
            -destination 'platform=macOS' \
            -only-testing:VideoScanTests \
            -resultBundlePath TestResults-Release.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee xcodebuild-test-release.log || XCODEBUILD_EXIT=$?
          # Same hardened check as Debug — see comment above.
          SUMMARY=$(xcrun xcresulttool get test-results summary --path TestResults-Release.xcresult --compact 2>/dev/null) || true
          FAILED=$(echo "$SUMMARY" | jq -r '.failedTests // 0')
          PASSED=$(echo "$SUMMARY" | jq -r '.passedTests // 0')
          TOTAL=$((PASSED + FAILED))
          echo "Release tests: $PASSED passed, $FAILED failed (xcodebuild exit ${XCODEBUILD_EXIT:-0})"
          if [ "${XCODEBUILD_EXIT:-0}" -ne 0 ]; then
            echo "::error::xcodebuild test (Release) exited non-zero: ${XCODEBUILD_EXIT}"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Release tests failed: $FAILED of $TOTAL"
            exit 1
          fi
          if [ "$TOTAL" -lt 100 ]; then
            echo "::error::Suspiciously low Release test count ($TOTAL). Treating as partial run / failure."
            exit 1
          fi

      - name: Test Summary (pass/fail with details)
        if: always()
        run: |
          chmod +x scripts/ci_test_summary.sh
          scripts/ci_test_summary.sh TestResults.xcresult

      - name: Coverage Summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo "## Coverage by File" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            xcrun xccov view --report --files-for-target VideoScan.app TestResults.xcresult \
              | awk -F'  +' 'NR>2 && $3 != "" {printf "%-50s %s\n", $2, $3}' \
              >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(coverage data unavailable)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo ""
            echo "## Overall"
            xcrun xccov view --report --only-targets TestResults.xcresult 2>/dev/null || echo "(no coverage data)"
          else
            echo "No TestResults.xcresult found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14

      - name: Upload Release Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release
          path: TestResults-Release.xcresult
          retention-days: 14

      - name: Upload diagnostic sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-sample
          path: /tmp/xctest-sample.txt
          retention-days: 14
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # Collect code-quality metrics and append to the `metrics` branch.
      #
      # We store history in a DEDICATED ORPHAN BRANCH (`metrics`) so the
      # main-branch history stays clean — the dashboard only appends,
      # never modifies source. The branch holds exactly one file:
      #   metrics/history.jsonl — one JSON row per CI run.
      #
      # First run auto-bootstraps the branch if it doesn't exist.
      # ---------------------------------------------------------------
      - name: Collect metrics + push to `metrics` branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # Run the collector against the CI workspace. It reads
          # TestResults.xcresult + $SWIFTLINT_OUTPUT + $PERIPHERY_OUTPUT
          # (env vars set by earlier steps) and writes ONE json line.
          chmod +x scripts/collect_metrics.sh
          ROW=$(scripts/collect_metrics.sh)
          echo "Metrics row:"
          echo "$ROW"

          # Set up a separate work dir so we don't disturb the main checkout.
          WORK=$(mktemp -d)
          cd "$WORK"

          # Clone only the metrics branch. If it doesn't exist, bootstrap it.
          git clone --branch metrics --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo \
            2>/dev/null || {
              echo "metrics branch does not exist — bootstrapping"
              git clone --depth 1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-repo
              cd metrics-repo
              git checkout --orphan metrics
              git rm -rf . 2>/dev/null || true
              mkdir -p metrics
              echo "# Metrics history" > README.md
              echo "One JSON row per CI run. Consumed by the dashboard at docs/index.html on main." >> README.md
              touch metrics/history.jsonl
              git add README.md metrics/history.jsonl
              git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
                commit -m "Bootstrap metrics branch [skip ci]"
              git push -u origin metrics
              cd ..
            }

          cd metrics-repo
          mkdir -p metrics
          echo "$ROW" >> metrics/history.jsonl

          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              add metrics/history.jsonl
          git -c user.email="ci@videoscan" -c user.name="VideoScan CI" \
              commit -m "metrics: ${GITHUB_SHA:0:8} on ${GITHUB_REF_NAME} [skip ci]"

          # Retry once on push race (another CI run may have just pushed).
          git push origin metrics || {
              echo "push failed — pulling and retrying once"
              git pull --rebase origin metrics
              git push origin metrics
          }
