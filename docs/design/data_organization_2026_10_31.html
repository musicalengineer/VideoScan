<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/></marker></defs>
<rect x="400" y="40" width="420" height="560" rx="16" fill="#58a6ff22" stroke="#58a6ff" stroke-width="2"/>
<text x="416" y="68" font-size="18" font-weight="700" fill="#58a6ff">catalog.sqlite — the truth (one committer, fixity, backups, rows never deleted)</text>
<rect x="420" y="90" width="380" height="86" rx="16" fill="#2f6fb322" stroke="#2f6fb3" stroke-width="2"/>
<text x="436" y="118" font-size="15" font-weight="700" fill="#2f6fb3">A. Identity  ·  9 tables · 54,495 rows</text>
<text x="436" y="142" fill="#e6edf3" font-size="12">what a file IS: content (SHA-256), files (sightings on volumes), tombs</text>
<text x="436" y="160" fill="#e6edf3" font-size="12">tones</text>
<rect x="420" y="190" width="380" height="86" rx="16" fill="#3b8f5a22" stroke="#3b8f5a" stroke-width="2"/>
<text x="436" y="218" font-size="15" font-weight="700" fill="#3b8f5a">B. Rick&#x27;s decisions  ·  18 tables · 6,470 rows</text>
<text x="436" y="242" fill="#e6edf3" font-size="12">user dates / places / notes, stars, people tags, events, archive — hig</text>
<text x="436" y="260" fill="#e6edf3" font-size="12">hest rank</text>
<rect x="420" y="290" width="380" height="86" rx="16" fill="#7a4fa822" stroke="#7a4fa8" stroke-width="2"/>
<text x="436" y="318" font-size="15" font-weight="700" fill="#7a4fa8">C. Machine observations  ·  19 tables · 182,826 rows</text>
<text x="436" y="342" fill="#e6edf3" font-size="12">captions, transcripts, inferred dates, dossiers, prints, likeness, dup</text>
<text x="436" y="360" fill="#e6edf3" font-size="12">licates</text>
<rect x="420" y="390" width="380" height="86" rx="16" fill="#b07a1f22" stroke="#b07a1f" stroke-width="2"/>
<text x="436" y="418" font-size="15" font-weight="700" fill="#b07a1f">D. Search  ·  6 tables · 3 rows</text>
<text x="436" y="442" fill="#e6edf3" font-size="12">full-text index over captions and transcripts</text>
<rect x="420" y="490" width="380" height="86" rx="16" fill="#6b728022" stroke="#6b7280" stroke-width="2"/>
<text x="436" y="518" font-size="15" font-weight="700" fill="#6b7280">E. Bookkeeping  ·  11 tables · 44,365 rows</text>
<text x="436" y="542" fill="#e6edf3" font-size="12">generations, the ledger, imports, audits, job markers</text>
<rect x="40" y="60" width="300" height="150" rx="16" fill="#3b8f5a22" stroke="#3b8f5a" stroke-width="2"/>
<text x="56" y="88" font-size="15" font-weight="700" fill="#3b8f5a">Rick</text>
<text x="56" y="112" fill="#e6edf3" font-size="12">decisions typed in the app:</text>
<text x="56" y="130" fill="#e6edf3" font-size="12">dates, places, people, events, archive, stars.</text>
<text x="56" y="148" fill="#e6edf3" font-size="12">Always outrank a machine observation.</text>
<rect x="40" y="250" width="300" height="170" rx="16" fill="#7a4fa822" stroke="#7a4fa8" stroke-width="2"/>
<text x="56" y="278" font-size="15" font-weight="700" fill="#7a4fa8">Engines and models (the helper)</text>
<text x="56" y="302" fill="#e6edf3" font-size="12">captioner (8B), Whisper, era contract, prints,</text>
<text x="56" y="320" fill="#e6edf3" font-size="12">fingerprint matching, integrity checks.</text>
<text x="56" y="338" fill="#e6edf3" font-size="12">Writes a JOURNAL, never the catalog.</text>
<rect x="40" y="460" width="300" height="140" rx="16" fill="#b07a1f22" stroke="#b07a1f" stroke-width="2"/>
<text x="56" y="488" font-size="15" font-weight="700" fill="#b07a1f">Media files + volumes</text>
<text x="56" y="512" fill="#e6edf3" font-size="12">the footage itself, probed read-only:</text>
<text x="56" y="530" fill="#e6edf3" font-size="12">container, codecs, dates, DV datecode.</text>
<rect x="880" y="60" width="270" height="230" rx="16" fill="#7a4fa822" stroke="#7a4fa8" stroke-width="2"/>
<text x="896" y="88" font-size="15" font-weight="700" fill="#7a4fa8">Sidecar stores (bulk, regenerable)</text>
<text x="896" y="112" fill="#e6edf3" font-size="12">audio-fingerprints.sqlite — landmarks</text>
<text x="896" y="130" fill="#e6edf3" font-size="12">model-lab.sqlite — every raw model</text>
<text x="896" y="148" fill="#e6edf3" font-size="12">   output, segments, vectors (append-only)</text>
<text x="896" y="166" fill="#e6edf3" font-size="12">metadata_cache.sqlite — ffprobe cache</text>
<text x="896" y="184" fill="#e6edf3" font-size="12">   (keyed by path + size + mtime)</text>
<rect x="880" y="330" width="270" height="130" rx="16" fill="#6b728022" stroke="#6b7280" stroke-width="2"/>
<text x="896" y="358" font-size="15" font-weight="700" fill="#6b7280">Helper files (in transit)</text>
<text x="896" y="382" fill="#e6edf3" font-size="12">background/queue — job requests</text>
<text x="896" y="400" fill="#e6edf3" font-size="12">background/checkpoints — last unit done</text>
<text x="896" y="418" fill="#e6edf3" font-size="12">background/journal/*.jsonl — facts to apply</text>
<rect x="880" y="500" width="270" height="100" rx="16" fill="#6b728022" stroke="#6b7280" stroke-width="2"/>
<text x="896" y="528" font-size="15" font-weight="700" fill="#6b7280">.scratch/ (lab bench, thrown away)</text>
<text x="896" y="552" fill="#e6edf3" font-size="12">bench runs, frames, review verdicts</text>
<text x="896" y="570" fill="#e6edf3" font-size="12">never in git, never a source of truth</text>

<path d="M880 440 C850.0 440 850.0 330 820 330" fill="none" stroke="#7a4fa8" stroke-width="2" marker-end="url(#ah)"/>
<text x="850.0" y="379.0" fill="#7a4fa8" font-size="11" text-anchor="middle">committer applies the journal</text>
<path d="M340 310 C610.0 310 610.0 170 880 170" fill="none" stroke="#7a4fa8" stroke-width="2" marker-end="url(#ah)"/>
<text x="610.0" y="234.0" fill="#7a4fa8" font-size="11" text-anchor="middle">bulk outputs</text>
<path d="M340 530 C370.0 530 370.0 150 400 150" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>
<text x="370.0" y="334.0" fill="#9aa4b2" font-size="11" text-anchor="middle">scan, hash, probe</text>
<path d="M880 180 C850.0 180 850.0 300 820 300" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ah)"/>
<text x="850.0" y="234.0" fill="#9aa4b2" font-size="11" text-anchor="middle">app reads directly</text>
<text x="40" y="626" fill="#9aa4b2" font-size="12">A decision always outranks an observation. An observation never supports the inference that produced it. 70 foreign keys tie the tables to content and files.</text>
